<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversión de Unidades y Prefijos del SI</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --success: #16a34a;
      --error: #dc2626;
      --warning: #d97706;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }

    .quiz-card {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary-dark);
      margin-bottom: 0.25rem;
    }

    .progress {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    .question-block {
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f0f9ff;
    }

    .option-btn.selected-correct {
      background-color: #dcfce7;
      border-color: var(--success);
      color: #166534;
      font-weight: 600;
    }

    .option-btn.selected-incorrect {
      background-color: #fef2f2;
      border-color: var(--error);
      color: #991b1b;
    }

    .explanation {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }

    .explanation.show { display: block; }
    .exp-correct { background: #f0fdf4; border-left: 4px solid var(--success); color: #166534; }
    .exp-incorrect { background: #fff1f2; border-left: 4px solid var(--error); color: #9f1239; }

    .nav-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      padding: 0.65rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-next:hover { background: var(--primary-dark); }
    .btn-next:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Estilos de la pantalla de resultados */
    .results-container {
      text-align: center;
      padding: 1.5rem 0.5rem;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-weight: 800;
      font-size: 1.8rem;
    }

    .score-circle.perfect {
      background: #dcfce7;
      color: var(--success);
      border: 4px solid var(--success);
    }

    .score-circle.partial {
      background: #fef3c7;
      color: var(--warning);
      border: 4px solid var(--warning);
    }

    .score-circle.low {
      background: #fee2e2;
      color: var(--error);
      border: 4px solid var(--error);
    }

    .score-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: -4px;
    }

    .result-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .result-msg {
      font-size: 0.95rem;
      color: #475569;
      max-width: 500px;
      margin: 0 auto 1.75rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <header>
    <div class="progress" id="progress">Pregunta 1 de 3</div>
    <h1>Conversión y Prefijos del SI</h1>
  </header>

  <div id="quiz-body">
    <div class="question-block">
      <div class="question-title" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div class="explanation" id="explanation-box"></div>
    </div>

    <div class="nav-actions">
      <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Siguiente</button>
    </div>
  </div>
</div>

<script>
  const questions = [
    {
      q: "¿A cuántos metros equivalen 5 km?",
      options: [
        { text: "A) 50 m", correct: false },
        { text: "B) 5,000 m", correct: true },
        { text: "C) 500 m", correct: false },
        { text: "D) 0.005 m", correct: false }
      ],
      exp: "¡Correcto! El prefijo 'kilo' representa 10³ (1,000 unidades). Por lo tanto, 5 km = 5 × 1,000 m = 5,000 m."
    },
    {
      q: "Si un vehículo viaja a 25 m/s, ¿cuál es su velocidad equivalente en kilómetros por hora (km/h)?",
      options: [
        { text: "A) 72 km/h", correct: false },
        { text: "B) 90 km/h", correct: true },
        { text: "C) 100 km/h", correct: false },
        { text: "D) 60 km/h", correct: false }
      ],
      exp: "¡Correcto! Aplicando factores de conversión: 25 m/s × (3600 s / 1 h) × (1 km / 1000 m) = 90 km/h (o multiplicando directamente 25 × 3.6 = 90)."
    },
    {
      q: "¿Qué prefijo del SI representa un factor de 10⁻³ (una milésima parte)?",
      options: [
        { text: "A) Centi-", correct: false },
        { text: "B) Micro-", correct: false },
        { text: "C) Mili-", correct: true },
        { text: "D) Kilo-", correct: false }
      ],
      exp: "¡Correcto! 'Mili-' (m) equivale a 10⁻³ (0.001). Recuerda que 'centi-' es 10⁻² y 'micro-' es 10⁻⁶."
    }
  ];

  let currentIdx = 0;
  let answered = false;
  let score = 0;

  function loadQuestion() {
    answered = false;
    const q = questions[currentIdx];
    document.getElementById('progress').innerText = `Pregunta ${currentIdx + 1} de ${questions.length}`;
    document.getElementById('question-text').innerText = q.q;
    document.getElementById('btn-next').disabled = true;
    document.getElementById('btn-next').innerText = currentIdx === questions.length - 1 ? "Ver resultados" : "Siguiente";

    const expBox = document.getElementById('explanation-box');
    expBox.className = "explanation";
    expBox.innerHTML = "";

    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';

    q.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(btn, opt.correct, q.exp);
      optContainer.appendChild(btn);
    });
  }

  function selectOption(button, isCorrect, expText) {
    if (answered) return;
    answered = true;

    if (isCorrect) score++;

    const allButtons = document.querySelectorAll('.option-btn');
    allButtons.forEach(b => b.disabled = true);

    const expBox = document.getElementById('explanation-box');
    expBox.classList.add('show');

    if (isCorrect) {
      button.classList.add('selected-correct');
      expBox.classList.add('exp-correct');
      expBox.innerHTML = `<strong>¡Correcto!</strong> ${expText}`;
    } else {
      button.classList.add('selected-incorrect');
      expBox.classList.add('exp-incorrect');
      expBox.innerHTML = `<strong>Incorrecto.</strong> ${expText}`;
    }

    document.getElementById('btn-next').disabled = false;
  }

  function nextQuestion() {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('progress').innerText = "Evaluación finalizada";
    
    let circleClass = "low";
    let title = "Sigue repasando la lección";
    let message = "Parece que algunos conceptos de conversión y prefijos aún generan dudas. ¡No te desanimes! Revisa nuevamente los videos explicativos y vuelve a intentarlo.";
    let titleColor = "var(--error)";

    if (score === questions.length) {
      circleClass = "perfect";
      title = "¡Excelente esfuerzo!";
      message = "¡Dominas a la perfección las conversiones y los prefijos del Sistema Internacional! Estás listo para continuar con los siguientes temas de física.";
      titleColor = "var(--success)";
    } else if (score >= 1) {
      circleClass = "partial";
      title = "¡Buen trabajo, te falta poco!";
      message = "Has demostrado comprender las bases, pero aún hay pequeños detalles por pulir. Da un repaso rápido a los factores de multiplicación y vuelve a practicar.";
      titleColor = "var(--warning)";
    }

    document.getElementById('quiz-body').innerHTML = `
      <div class="results-container">
        <div class="score-circle ${circleClass}">
          <span>${score}/${questions.length}</span>
          <span class="score-label">Aciertos</span>
        </div>
        <div class="result-title" style="color: ${titleColor};">${title}</div>
        <p class="result-msg">${message}</p>
        <button class="btn-next" onclick="resetQuiz()">Reintentar ejercicios</button>
      </div>
    `;
  }

  function resetQuiz() {
    score = 0;
    currentIdx = 0;
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>

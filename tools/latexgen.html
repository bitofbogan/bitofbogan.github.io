<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX Studio - Generador & Exportador de Fórmulas</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- KaTeX Core and mhchem extension -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>

  <!-- html2canvas for 100% reliable local rasterization without CORS issues -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* Transparency pattern */
    .bg-checkerboard {
      background-color: #090d16;
      background-image: 
        linear-gradient(45deg, #131b2e 25%, transparent 25%), 
        linear-gradient(-45deg, #131b2e 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #131b2e 75%), 
        linear-gradient(-45deg, transparent 75%, #131b2e 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    }

    /* Chalkboard theme */
    .theme-blackboard {
      background: radial-gradient(circle at 50% 50%, #1e3526 0%, #0d1c13 100%) !important;
      border: 3px solid #2d4a36 !important;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.6) !important;
    }

    /* Blueprint theme */
    .theme-blueprint {
      background-color: #0b2545 !important;
      background-image: 
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px) !important;
      background-size: 24px 24px !important;
      border: 2px solid #1e40af !important;
    }

    /* Grid paper */
    .theme-grid {
      background-color: #f8fafc !important;
      background-image: 
        linear-gradient(rgba(148, 163, 184, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.25) 1px, transparent 1px) !important;
      background-size: 20px 20px !important;
      border: 1px solid #cbd5e1 !important;
    }

    /* Gradients */
    .theme-gradient-dark {
      background: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #311042 100%) !important;
    }
    .theme-gradient-sunset {
      background: linear-gradient(135deg, #4338ca 0%, #7e22ce 50%, #e11d48 100%) !important;
    }
    .theme-gradient-ocean {
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 50%, #15803d 100%) !important;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
    
    .cursor-grab { cursor: grab; }
    .cursor-grabbing { cursor: grabbing !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-hidden select-none">

  <!-- Top Navigation Bar -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 lg:px-6 flex items-center justify-between shrink-0 z-40">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
        <i class="ph ph-function text-xl font-bold"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-2">
          LaTeX Studio <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">v2.1 HQ</span>
        </h1>
      </div>
    </div>

    <!-- Quick Action Bar -->
    <div class="flex items-center gap-2">
      <button id="btn-quick-copy" class="px-3.5 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-100 rounded-lg border border-slate-700 flex items-center gap-1.5 transition active:scale-95 shadow-sm">
        <i class="ph ph-copy text-base text-indigo-400"></i>
        <span>Copiar PNG</span>
      </button>

      <div class="relative inline-flex shadow-sm rounded-lg">
        <button id="btn-quick-download" class="px-4 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-l-lg shadow-md shadow-indigo-600/30 flex items-center gap-1.5 transition active:scale-95">
          <i class="ph ph-download-simple text-base font-bold"></i>
          <span>Descargar</span>
        </button>
        <div class="bg-indigo-700 w-[1px] h-auto"></div>
        <select id="quick-format-select" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-r-lg px-2 border-0 focus:ring-0 cursor-pointer">
          <option value="png">PNG</option>
          <option value="jpeg">JPG</option>
          <option value="webp">WEBP</option>
          <option value="svg">SVG</option>
        </select>
      </div>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-h-0 overflow-hidden">
    
    <!-- LEFT PANEL: Editor & Controles (Col 1-5) -->
    <section class="lg:col-span-5 border-r border-slate-800 bg-slate-900/40 flex flex-col h-full overflow-y-auto">
      
      <!-- Preset Formulas Pill Bar -->
      <div class="p-3 border-b border-slate-800/80 bg-slate-900/60 shrink-0">
        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
          <span>Ejemplos Rápidos</span>
          <span class="text-slate-500 text-[10px]">Haz clic para cargar</span>
        </div>
        <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
          <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 font-medium rounded-md border border-indigo-500/30 whitespace-nowrap transition" data-eq="quimica">🧪 Estequiometría</button>
          <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700/60 whitespace-nowrap transition" data-eq="schrodinger">Schrödinger</button>
          <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700/60 whitespace-nowrap transition" data-eq="euler">Identidad de Euler</button>
          <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700/60 whitespace-nowrap transition" data-eq="maxwell">Maxwell</button>
          <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700/60 whitespace-nowrap transition" data-eq="integral">Integral Gauss</button>
          <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700/60 whitespace-nowrap transition" data-eq="matriz">Matriz 3x3</button>
        </div>
      </div>

      <!-- Main Config Container -->
      <div class="p-4 flex-1 flex flex-col gap-4">
        
        <!-- Code Editor Section -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <label for="latex-input" class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
              <i class="ph ph-code text-indigo-400"></i> Código LaTeX
            </label>
            <button id="btn-clear-code" class="text-[11px] text-slate-400 hover:text-rose-400 transition" title="Limpiar código">Limpiar</button>
          </div>

          <!-- Shortcuts Bar -->
          <div class="flex flex-wrap gap-1 bg-slate-950 p-1.5 rounded-lg border border-slate-800 text-xs">
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\dfrac{a}{b}">\dfrac</button>
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\int_{a}^{b} f(x)\,dx">\int</button>
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\sum_{i=1}^{n}">\sum</button>
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\sqrt{x}">\sqrt</button>
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\left[ \dfrac{a}{b} \right]">[ \dfrac ]</button>
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\vphantom{\text{X}}">\vphantom</button>
            <button class="sym-btn px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded font-mono" data-code="\text{ mol }">\text</button>
          </div>

          <!-- LaTeX Textarea -->
          <textarea id="latex-input" spellcheck="false"
            class="w-full h-32 p-3 text-xs bg-slate-950 border border-slate-800 rounded-xl font-mono text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-y leading-relaxed"
            placeholder="Escribe tu código LaTeX aquí..."></textarea>

          <!-- Error Alert -->
          <div id="latex-error" class="hidden p-2.5 bg-rose-950/50 border border-rose-800 rounded-lg text-rose-300 text-xs flex items-start gap-2">
            <i class="ph ph-warning-circle text-base mt-0.5 text-rose-400 shrink-0"></i>
            <span id="latex-error-msg" class="break-all font-mono">Error</span>
          </div>
        </div>

        <!-- Customization Controls -->
        <div class="border-t border-slate-800 pt-3 flex flex-col gap-3">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="ph ph-paint-brush-broad text-indigo-400"></i> Estilo Visual & Lienzo
          </h2>

          <!-- Text Color & Background -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-medium text-slate-400 mb-1 block">Color de Fórmula</label>
              <div class="flex items-center gap-2">
                <input type="color" id="text-color-picker" value="#ffffff" class="w-8 h-8 rounded border border-slate-700 bg-transparent cursor-pointer p-0">
                <select id="text-color-preset" class="bg-slate-950 border border-slate-800 rounded-lg text-xs py-1.5 px-2 text-slate-200 focus:outline-none flex-1">
                  <option value="#ffffff">Blanco</option>
                  <option value="#0f172a">Negro carbón</option>
                  <option value="#60a5fa">Azul celeste</option>
                  <option value="#fcd34d">Oro áureo</option>
                  <option value="#4ade80">Verde menta</option>
                  <option value="#f472b6">Rosa neón</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-[11px] font-medium text-slate-400 mb-1 block">Fondo del Lienzo</label>
              <select id="bg-preset" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-xs py-2 px-2.5 text-slate-200 focus:outline-none">
                <option value="transparent">Transparente</option>
                <option value="solid-dark">Oscuro (#0f172a)</option>
                <option value="solid-white">Blanco puro</option>
                <option value="gradient-dark">Gradiente Oscuro</option>
                <option value="gradient-sunset">Gradiente Neón Púrpura</option>
                <option value="gradient-ocean">Gradiente Oceánico</option>
                <option value="blackboard">Pizarra de Tiza</option>
                <option value="grid">Papel Milimetrado</option>
                <option value="blueprint">Plano Técnico Azul</option>
              </select>
            </div>
          </div>

          <!-- Sizes: Formula Size & Padding -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-[11px] font-medium text-slate-400">Tamaño Fórmula</label>
                <span id="label-font-size" class="text-[10px] text-slate-500 font-mono">1.8x</span>
              </div>
              <input type="range" id="input-font-size" min="0.8" max="4.0" step="0.1" value="1.8" class="w-full accent-indigo-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-[11px] font-medium text-slate-400">Margen (Padding)</label>
                <span id="label-padding" class="text-[10px] text-slate-500 font-mono">32px</span>
              </div>
              <input type="range" id="input-padding" min="8" max="96" step="4" value="32" class="w-full accent-indigo-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            </div>
          </div>

          <!-- Aspect Ratio & Corner Radius -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-medium text-slate-400 mb-1 block">Aspecto / Encuadre</label>
              <select id="aspect-ratio" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-xs py-2 px-2 text-slate-200 focus:outline-none">
                <option value="auto">Auto-Ajustado (Recorte justo)</option>
                <option value="1:1">1:1 Cuadrado (Social/Icon)</option>
                <option value="16:9">16:9 Presentación (Slides)</option>
                <option value="4:3">4:3 Clásico</option>
                <option value="9:16">9:16 Vertical (Stories)</option>
              </select>
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-[11px] font-medium text-slate-400">Esquinas Redondeadas</label>
                <span id="label-radius" class="text-[10px] text-slate-500 font-mono">16px</span>
              </div>
              <input type="range" id="input-radius" min="0" max="48" step="2" value="16" class="w-full accent-indigo-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            </div>
          </div>

          <!-- Border & Shadow checkboxes -->
          <div class="flex items-center gap-4 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800">
            <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
              <input type="checkbox" id="check-shadow" checked class="rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0">
              <span>Sombra suave</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
              <input type="checkbox" id="check-border" checked class="rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0">
              <span>Borde de tarjeta</span>
            </label>
          </div>
        </div>

        <!-- Export Settings Section -->
        <div class="border-t border-slate-800 pt-3 flex flex-col gap-3">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="ph ph-gear text-indigo-400"></i> Calidad de Exportación
          </h2>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-medium text-slate-400 mb-1 block">Escala / Resolución</label>
              <select id="export-scale" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-xs py-2 px-2 text-slate-200 focus:outline-none font-mono">
                <option value="1">1x (Estándar Web)</option>
                <option value="2" selected>2x (Alta Definición HD)</option>
                <option value="4">4x (Ultra HD / Impresión)</option>
              </select>
            </div>

            <div>
              <label class="text-[11px] font-medium text-slate-400 mb-1 block">Formato Predeterminado</label>
              <select id="export-format" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-xs py-2 px-2 text-slate-200 focus:outline-none">
                <option value="png">PNG (Transparencia)</option>
                <option value="jpeg">JPEG (Fondo Sólido)</option>
                <option value="webp">WebP (Optimizado)</option>
                <option value="svg">SVG (Vectorial puro)</option>
              </select>
            </div>
          </div>
        </div>

      </div>
    </section>

    <section class="lg:col-span-7 bg-slate-950 flex flex-col h-full relative overflow-hidden select-none">
      
      <!-- Liveview Top Toolbar with Zoom Status -->
      <div class="p-2.5 border-b border-slate-800 bg-slate-900/80 backdrop-blur flex items-center justify-between z-20">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            En vivo
          </span>
          <span id="canvas-dim-indicator" class="text-xs text-slate-400 font-mono">0 × 0 px</span>
        </div>

        <!-- Zoom Controls & Pan Guide -->
        <div class="flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 rounded-lg p-1 text-xs">
          <span class="text-[11px] text-slate-400 px-1 hidden sm:inline"><i class="ph ph-mouse-simple mr-1"></i>Ruedita: Zoom</span>
          <button id="btn-zoom-out" class="p-1 hover:bg-slate-800 text-slate-300 rounded transition" title="Reducir zoom (Ruedita abajo)">
            <i class="ph ph-minus font-bold"></i>
          </button>
          <span id="zoom-level-text" class="px-1.5 font-mono text-[11px] text-indigo-400 font-semibold min-w-[45px] text-center">100%</span>
          <button id="btn-zoom-in" class="p-1 hover:bg-slate-800 text-slate-300 rounded transition" title="Aumentar zoom (Ruedita arriba)">
            <i class="ph ph-plus font-bold"></i>
          </button>
          <div class="w-[1px] h-3.5 bg-slate-800 mx-0.5"></div>
          <button id="btn-zoom-reset" class="px-2 py-0.5 hover:bg-slate-800 text-slate-300 rounded transition text-[11px]" title="Restablecer posición y zoom al 100%">
            100%
          </button>
          <button id="btn-zoom-fit" class="p-1 hover:bg-slate-800 text-slate-300 rounded transition" title="Ajustar al centro">
            <i class="ph ph-arrows-in-cardinal"></i>
          </button>
        </div>
      </div>

      <!-- Liveview Interactive Viewport (Pannable & Zoomable with Wheel) -->
      <div id="viewport-container" class="flex-1 overflow-hidden bg-checkerboard relative cursor-grab flex items-center justify-center">
        
        <!-- Pan and Zoom Transformer Layer -->
        <div id="viewport-stage" class="origin-center transition-transform duration-75 ease-out inline-flex items-center justify-center p-8">
          
          <!-- Rendered Card Container -->
          <div id="preview-wrapper" class="flex items-center justify-center relative transition-all max-w-[90vw] max-h-[80vh]">
            <div id="math-render-target" class="flex items-center justify-center text-center">
              <!-- Rendered formula inserted here -->
            </div>
          </div>

        </div>

        <!-- Floating Tip -->
        <div class="absolute bottom-3 left-3 text-[11px] text-slate-400 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-md border border-slate-800/80 pointer-events-none flex items-center gap-1.5 shadow">
          <i class="ph ph-hand-grabbing text-indigo-400"></i>
          <span>Arrastra para mover el lienzo • Rueda para zoom</span>
        </div>
      </div>

      <!-- Toast Notification Alert -->
      <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2.5 z-50 text-xs pointer-events-none">
        <i id="toast-icon" class="ph ph-check-circle text-emerald-400 text-lg"></i>
        <span id="toast-message">Copiado al portapapeles</span>
      </div>

    </section>

  </main>

  <script>
    // Formula Presets Catalog
    const FORMULA_PRESETS = {
      quimica: "(300\\text{ g})\\left[ \\dfrac{1\\text{ mol CH}_4}{16\\text{ g}\\vphantom{\\text{CH}_4}} \\right]\\left[ \\dfrac{2\\text{ mol CO}\\vphantom{\\text{CH}_4}}{2\\text{ mol CH}_4} \\right]\\left[ \\dfrac{28\\text{ g}\\vphantom{\\text{CH}_4}}{1\\text{ mol CO}\\vphantom{\\text{CH}_4}} \\right] = 525\\text{ g}",
      schrodinger: "i\\hbar \\frac{\\partial}{\\partial t}\\Psi(\\mathbf{r},t) = \\left[ -\\frac{\\hbar^2}{2m}\\nabla^2 + V(\\mathbf{r},t) \\right] \\Psi(\\mathbf{r},t)",
      euler: "e^{i\\pi} + 1 = 0",
      maxwell: "\\begin{aligned}\n\\nabla \\cdot \\mathbf{E} &= \\frac{\\rho}{\\varepsilon_0} \\\\\n\\nabla \\cdot \\mathbf{B} &= 0 \\\\\n\\nabla \\times \\mathbf{E} &= -\\frac{\\partial \\mathbf{B}}{\\partial t}\n\\end{aligned}",
      integral: "\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}",
      matriz: "\\mathbf{R} = \\begin{pmatrix} \\cos\\theta & -\\sin\\theta & 0 \\\\ \\sin\\theta & \\cos\\theta & 0 \\\\ 0 & 0 & 1 \\end{pmatrix}"
    };

    // DOM Elements
    const latexInput = document.getElementById('latex-input');
    const mathTarget = document.getElementById('math-render-target');
    const previewWrapper = document.getElementById('preview-wrapper');
    const errorBox = document.getElementById('latex-error');
    const errorMsg = document.getElementById('latex-error-msg');
    const dimIndicator = document.getElementById('canvas-dim-indicator');

    // Controls
    const textColorPicker = document.getElementById('text-color-picker');
    const textColorPreset = document.getElementById('text-color-preset');
    const bgPreset = document.getElementById('bg-preset');
    const inputFontSize = document.getElementById('input-font-size');
    const labelFontSize = document.getElementById('label-font-size');
    const inputPadding = document.getElementById('input-padding');
    const labelPadding = document.getElementById('label-padding');
    const aspectRatioSelect = document.getElementById('aspect-ratio');
    const inputRadius = document.getElementById('input-radius');
    const labelRadius = document.getElementById('label-radius');
    const checkShadow = document.getElementById('check-shadow');
    const checkBorder = document.getElementById('check-border');
    const exportScale = document.getElementById('export-scale');
    const exportFormat = document.getElementById('export-format');
    const quickFormatSelect = document.getElementById('quick-format-select');

    // Buttons
    const btnQuickDownload = document.getElementById('btn-quick-download');
    const btnQuickCopy = document.getElementById('btn-quick-copy');
    const btnClearCode = document.getElementById('btn-clear-code');

    // Viewport Pan/Zoom elements
    const viewportContainer = document.getElementById('viewport-container');
    const viewportStage = document.getElementById('viewport-stage');
    const zoomLevelText = document.getElementById('zoom-level-text');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomReset = document.getElementById('btn-zoom-reset');
    const btnZoomFit = document.getElementById('btn-zoom-fit');

    // Toast
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');

    // Toast feedback helper
    function showToast(msg, isSuccess = true) {
      toastMessage.textContent = msg;
      toastIcon.className = isSuccess ? 'ph ph-check-circle text-emerald-400 text-lg' : 'ph ph-warning text-amber-400 text-lg';
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // Zoom & Pan state
    let zoomState = {
      scale: 1,
      panX: 0,
      panY: 0,
      isDragging: false,
      startX: 0,
      startY: 0
    };

    function updateTransform() {
      viewportStage.style.transform = `translate(${zoomState.panX}px, ${zoomState.panY}px) scale(${zoomState.scale})`;
      zoomLevelText.textContent = `${Math.round(zoomState.scale * 100)}%`;
    }

    function setZoom(newScale, focalX = null, focalY = null) {
      const minScale = 0.25;
      const maxScale = 5.0;
      const clamped = Math.min(Math.max(newScale, minScale), maxScale);

      if (focalX !== null && focalY !== null) {
        // Zoom towards mouse cursor focal point
        const factor = clamped / zoomState.scale;
        zoomState.panX = focalX - (focalX - zoomState.panX) * factor;
        zoomState.panY = focalY - (focalY - zoomState.panY) * factor;
      }

      zoomState.scale = clamped;
      updateTransform();
    }

    // Mouse Wheel Zoom Handler
    viewportContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = viewportContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left - rect.width / 2;
      const mouseY = e.clientY - rect.top - rect.height / 2;

      // Negative delta = zoom in, Positive = zoom out
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      setZoom(zoomState.scale * zoomFactor, mouseX, mouseY);
    }, { passive: false });

    // Pan / Drag Handlers
    viewportContainer.addEventListener('mousedown', (e) => {
      // Allow dragging with primary or middle mouse button
      if (e.button === 0 || e.button === 1) {
        zoomState.isDragging = true;
        zoomState.startX = e.clientX - zoomState.panX;
        zoomState.startY = e.clientY - zoomState.panY;
        viewportContainer.classList.remove('cursor-grab');
        viewportContainer.classList.add('cursor-grabbing');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!zoomState.isDragging) return;
      zoomState.panX = e.clientX - zoomState.startX;
      zoomState.panY = e.clientY - zoomState.startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      if (zoomState.isDragging) {
        zoomState.isDragging = false;
        viewportContainer.classList.remove('cursor-grabbing');
        viewportContainer.classList.add('cursor-grab');
      }
    });

    // Touch gesture support for mobile devices
    let initialTouchDistance = null;
    let initialTouchScale = 1;

    viewportContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        zoomState.isDragging = true;
        zoomState.startX = e.touches[0].clientX - zoomState.panX;
        zoomState.startY = e.touches[0].clientY - zoomState.panY;
      } else if (e.touches.length === 2) {
        zoomState.isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialTouchDistance = Math.hypot(dx, dy);
        initialTouchScale = zoomState.scale;
      }
    });

    viewportContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && zoomState.isDragging) {
        zoomState.panX = e.touches[0].clientX - zoomState.startX;
        zoomState.panY = e.touches[0].clientY - zoomState.startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialTouchDistance) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const factor = dist / initialTouchDistance;
        setZoom(initialTouchScale * factor);
      }
    });

    viewportContainer.addEventListener('touchend', () => {
      zoomState.isDragging = false;
      initialTouchDistance = null;
    });

    // Zoom buttons
    btnZoomIn.addEventListener('click', () => setZoom(zoomState.scale * 1.25));
    btnZoomOut.addEventListener('click', () => setZoom(zoomState.scale * 0.8));
    btnZoomReset.addEventListener('click', () => {
      zoomState.scale = 1;
      zoomState.panX = 0;
      zoomState.panY = 0;
      updateTransform();
    });
    btnZoomFit.addEventListener('click', () => {
      zoomState.panX = 0;
      zoomState.panY = 0;
      zoomState.scale = 1;
      updateTransform();
    });

    // Sync quick format selector with settings format selector
    quickFormatSelect.addEventListener('change', (e) => {
      exportFormat.value = e.target.value;
    });
    exportFormat.addEventListener('change', (e) => {
      quickFormatSelect.value = e.target.value;
    });

    // Apply Styles to Preview Card
    function applyCardStyles() {
      const bg = bgPreset.value;
      const radius = inputRadius.value + 'px';
      const pad = inputPadding.value + 'px';
      const hasShadow = checkShadow.checked;
      const hasBorder = checkBorder.checked;

      // Reset classes
      previewWrapper.className = 'flex items-center justify-center relative transition-all duration-150';
      previewWrapper.style.borderRadius = radius;
      previewWrapper.style.padding = pad;
      previewWrapper.style.background = '';
      previewWrapper.style.backgroundColor = '';

      // Shadow
      previewWrapper.style.boxShadow = hasShadow 
        ? '0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05)' 
        : 'none';

      // Border
      if (hasBorder) {
        previewWrapper.style.border = (bg === 'transparent') 
          ? '1.5px dashed rgba(255, 255, 255, 0.3)' 
          : '1px solid rgba(255, 255, 255, 0.15)';
      } else {
        previewWrapper.style.border = 'none';
      }

      // Background types
      if (bg === 'transparent') {
        previewWrapper.style.background = 'transparent';
      } else if (bg === 'solid-dark') {
        previewWrapper.style.backgroundColor = '#0f172a';
      } else if (bg === 'solid-white') {
        previewWrapper.style.backgroundColor = '#ffffff';
        if (hasBorder) previewWrapper.style.border = '1px solid #e2e8f0';
      } else if (bg === 'gradient-dark') {
        previewWrapper.classList.add('theme-gradient-dark');
      } else if (bg === 'gradient-sunset') {
        previewWrapper.classList.add('theme-gradient-sunset');
      } else if (bg === 'gradient-ocean') {
        previewWrapper.classList.add('theme-gradient-ocean');
      } else if (bg === 'blackboard') {
        previewWrapper.classList.add('theme-blackboard');
      } else if (bg === 'grid') {
        previewWrapper.classList.add('theme-grid');
      } else if (bg === 'blueprint') {
        previewWrapper.classList.add('theme-blueprint');
      }

      applyAspectRatio();
    }

    function applyAspectRatio() {
      const ratio = aspectRatioSelect.value;
      previewWrapper.style.width = '';
      previewWrapper.style.height = '';
      previewWrapper.style.aspectRatio = '';
      previewWrapper.style.minWidth = '';
      previewWrapper.style.minHeight = '';

      if (ratio === '1:1') {
        previewWrapper.style.aspectRatio = '1 / 1';
        previewWrapper.style.minWidth = '320px';
      } else if (ratio === '16:9') {
        previewWrapper.style.aspectRatio = '16 / 9';
        previewWrapper.style.minWidth = '440px';
      } else if (ratio === '4:3') {
        previewWrapper.style.aspectRatio = '4 / 3';
        previewWrapper.style.minWidth = '360px';
      } else if (ratio === '9:16') {
        previewWrapper.style.aspectRatio = '9 / 16';
        previewWrapper.style.minHeight = '420px';
      }

      setTimeout(updateDimensionIndicator, 60);
    }

    function updateDimensionIndicator() {
      const rect = previewWrapper.getBoundingClientRect();
      const currentScale = zoomState.scale || 1;
      const trueWidth = Math.round(rect.width / currentScale);
      const trueHeight = Math.round(rect.height / currentScale);
      const scaleMultiplier = parseInt(exportScale.value, 10);
      const finalW = Math.round(trueWidth * scaleMultiplier);
      const finalH = Math.round(trueHeight * scaleMultiplier);
      dimIndicator.textContent = `${finalW} × ${finalH} px (${scaleMultiplier}x)`;
    }

    // Render LaTeX using KaTeX
    function renderLatex() {
      const formula = latexInput.value.trim();
      const textColor = textColorPicker.value;
      const fontSize = inputFontSize.value;

      if (!formula) {
        mathTarget.innerHTML = `<span class="text-slate-600 italic select-none">Ingresa una fórmula para previsualizar...</span>`;
        errorBox.classList.add('hidden');
        updateDimensionIndicator();
        return;
      }

      try {
        const html = window.katex.renderToString(formula, {
          displayMode: true,
          throwOnError: true,
          output: 'htmlAndMathml'
        });

        mathTarget.innerHTML = html;
        mathTarget.style.color = textColor;
        mathTarget.style.fontSize = `${fontSize * 1.5}rem`;
        errorBox.classList.add('hidden');

        applyCardStyles();
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorMsg.textContent = err.message || 'Error de sintaxis en LaTeX';
      }
    }

    // Pure Vector SVG Generator
    function generateStandaloneSvg() {
      const rect = previewWrapper.getBoundingClientRect();
      const currentScale = zoomState.scale || 1;
      const trueWidth = Math.max(120, Math.round(rect.width / currentScale));
      const trueHeight = Math.max(80, Math.round(rect.height / currentScale));
      const scale = parseInt(exportScale.value, 10);
      const width = trueWidth * scale;
      const height = trueHeight * scale;
      const bg = bgPreset.value;
      const radius = parseInt(inputRadius.value, 10) * scale;
      const textColor = textColorPicker.value;
      const fontSizePx = Math.round(parseFloat(inputFontSize.value) * 24 * scale);
      const paddingPx = parseInt(inputPadding.value, 10) * scale;

      let defs = '';
      let bgRect = '';

      if (bg === 'solid-dark') {
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="#0f172a" />`;
      } else if (bg === 'solid-white') {
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />`;
      } else if (bg === 'gradient-sunset') {
        defs = `<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4338ca"/><stop offset="50%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>`;
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="url(#g)" />`;
      } else if (bg === 'gradient-ocean') {
        defs = `<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="50%" stop-color="#0d9488"/><stop offset="100%" stop-color="#15803d"/></linearGradient>`;
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="url(#g)" />`;
      } else if (bg === 'blackboard') {
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="#14261b" stroke="#2d4a36" stroke-width="4" />`;
      } else if (bg === 'blueprint') {
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="#0b2545" stroke="#1e40af" stroke-width="3" />`;
      } else if (bg === 'gradient-dark') {
        defs = `<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient>`;
        bgRect = `<rect width="${width}" height="${height}" rx="${radius}" fill="url(#g)" />`;
      }

      const mathHtml = mathTarget.innerHTML;

      return `<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  ${defs ? `<defs>${defs}</defs>` : ''}
  ${bgRect}
  <foreignObject x="0" y="0" width="${width}" height="${height}">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:${textColor};font-size:${fontSizePx}px;font-family:system-ui,sans-serif;box-sizing:border-box;padding:${paddingPx}px;">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
      <div style="text-align:center;">
        ${mathHtml}
      </div>
    </div>
  </foreignObject>
</svg>`;
    }

    // Robust rasterization using html2canvas directly on the DOM element
    async function capturePreviewCanvas() {
      const bg = bgPreset.value;
      const scale = parseInt(exportScale.value, 10);
      const isTransparent = (bg === 'transparent');

      // Temporarily save original transform and reset zoom to 1 to capture accurately
      const originalTransform = viewportStage.style.transform;
      viewportStage.style.transform = 'none';

      // Temporarily hide border outline if transparent to avoid dashed border in output
      const originalBorder = previewWrapper.style.border;
      if (isTransparent) {
        previewWrapper.style.border = 'none';
      }

      try {
        const canvas = await html2canvas(previewWrapper, {
          scale: scale,
          backgroundColor: isTransparent ? null : undefined,
          useCORS: true,
          logging: false
        });

        // Restore styles
        viewportStage.style.transform = originalTransform;
        previewWrapper.style.border = originalBorder;

        return canvas;
      } catch (err) {
        viewportStage.style.transform = originalTransform;
        previewWrapper.style.border = originalBorder;
        throw err;
      }
    }

    // Download routine
    async function handleDownload() {
      const format = exportFormat.value;
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      const filename = `formula-${timestamp}.${format}`;

      if (format === 'svg') {
        const svgCode = generateStandaloneSvg();
        const blob = new Blob([svgCode], { type: 'image/svg+xml;charset=utf-8' });
        saveBlob(blob, filename);
        showToast('SVG descargado');
        return;
      }

      try {
        btnQuickDownload.disabled = true;
        btnQuickDownload.classList.add('opacity-75');

        const canvas = await capturePreviewCanvas();
        const mimeType = (format === 'jpeg') ? 'image/jpeg' : (format === 'webp') ? 'image/webp' : 'image/png';

        canvas.toBlob((blob) => {
          btnQuickDownload.disabled = false;
          btnQuickDownload.classList.remove('opacity-75');
          if (blob) {
            saveBlob(blob, filename);
            showToast(`Descargado: ${filename}`);
          } else {
            showToast('Error al generar imagen', false);
          }
        }, mimeType, 0.95);
      } catch (err) {
        btnQuickDownload.disabled = false;
        btnQuickDownload.classList.remove('opacity-75');
        showToast('Error al capturar la imagen', false);
      }
    }

    function saveBlob(blob, filename) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(url);
        a.remove();
      }, 200);
    }

    // Direct Copy PNG to clipboard
    async function handleCopyPng() {
      try {
        btnQuickCopy.disabled = true;
        btnQuickCopy.classList.add('opacity-75');

        const canvas = await capturePreviewCanvas();
        canvas.toBlob(async (blob) => {
          btnQuickCopy.disabled = false;
          btnQuickCopy.classList.remove('opacity-75');

          if (!blob) {
            showToast('No se pudo generar la imagen', false);
            return;
          }

          if (navigator.clipboard && window.ClipboardItem) {
            try {
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              showToast('¡Imagen PNG copiada al portapapeles!');
              return;
            } catch (err) {
              // Browser may restrict clipboard access in some frames, trigger download fallback
              saveBlob(blob, 'formula.png');
              showToast('Permiso de portapapeles bloqueado. Archivo descargado en su lugar.');
            }
          } else {
            saveBlob(blob, 'formula.png');
            showToast('Portapapeles no soportado. Archivo PNG descargado.');
          }
        }, 'image/png');
      } catch (err) {
        btnQuickCopy.disabled = false;
        btnQuickCopy.classList.remove('opacity-75');
        showToast('Error al procesar la imagen para copiar', false);
      }
    }

    latexInput.addEventListener('input', renderLatex);

    inputFontSize.addEventListener('input', (e) => {
      labelFontSize.textContent = `${e.target.value}x`;
      renderLatex();
    });

    inputPadding.addEventListener('input', (e) => {
      labelPadding.textContent = `${e.target.value}px`;
      applyCardStyles();
    });

    inputRadius.addEventListener('input', (e) => {
      labelRadius.textContent = `${e.target.value}px`;
      applyCardStyles();
    });

    aspectRatioSelect.addEventListener('change', applyCardStyles);
    bgPreset.addEventListener('change', applyCardStyles);
    checkShadow.addEventListener('change', applyCardStyles);
    checkBorder.addEventListener('change', applyCardStyles);
    exportScale.addEventListener('change', updateDimensionIndicator);

    textColorPicker.addEventListener('input', () => renderLatex());
    textColorPreset.addEventListener('change', (e) => {
      textColorPicker.value = e.target.value;
      renderLatex();
    });

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const eq = btn.dataset.eq;
        if (FORMULA_PRESETS[eq]) {
          latexInput.value = FORMULA_PRESETS[eq];
          renderLatex();
          showToast(`Fórmula cargada`);
        }
      });
    });

    // Symbols toolbar
    document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const snippet = btn.dataset.code;
        const start = latexInput.selectionStart;
        const end = latexInput.selectionEnd;
        const val = latexInput.value;
        latexInput.value = val.substring(0, start) + snippet + val.substring(end);
        latexInput.focus();
        latexInput.selectionStart = latexInput.selectionEnd = start + snippet.length;
        renderLatex();
      });
    });

    // Clear code
    btnClearCode.addEventListener('click', () => {
      latexInput.value = '';
      renderLatex();
      latexInput.focus();
    });

    // Download & Copy clicks
    btnQuickDownload.addEventListener('click', handleDownload);
    btnQuickCopy.addEventListener('click', handleCopyPng);

    // Initial setup with the chemistry example
    window.addEventListener('DOMContentLoaded', () => {
      latexInput.value = FORMULA_PRESETS.quimica;
      applyCardStyles();
      renderLatex();
      updateTransform();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aureka | Prepa Auge</title>
  <link rel="icon" type="image/png" href="augeicon.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            auge: {
              orange: '#F17D4B',
              darkOrange: '#D96534',
              gray: '#5A5D5E',
              dark: '#2D3134',
              canvas: '#FDFBF7'
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX para fórmulas matemáticas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- SortableJS para Drag & Drop amigable en móviles -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Transición elástica de barra de avance */
    .progress-bar-fill {
      transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Animación de error */
    @keyframes shakeSoft {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: shakeSoft 0.35s ease-in-out;
    }

    /* Animación de acierto */
    @keyframes bounceShort {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025) translateY(-2px); }
    }
    .animate-success {
      animation: bounceShort 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Destello de conexión para match_columns */
    @keyframes zapFade {
      0% { opacity: 0; stroke-dashoffset: 100; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }
    .zap-line {
      stroke-dasharray: 8 4;
      animation: zapFade 0.45s ease-out forwards;
    }

    /* Intro splash animada */
    @keyframes splashScale {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-splash {
      animation: splashScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* =========================================
       BARRA DE PROGRESO "BALATRO FIRE"
       ========================================= */
    .progress-bar-container {
      position: relative;
      overflow: visible;
    }

    .progress-bar-fill.on-fire {
      background: linear-gradient(90deg, #ff4500, #ff8c00, #ffd700, #ffffff) !important;
      background-size: 200% 200%;
      animation: fireGradient 0.8s ease infinite alternate;
      position: relative;
    }

    .progress-bar-fill.on-fire::after {
      content: "";
      position: absolute;
      top: -4px;
      right: -2px;
      width: 14px;
      height: calc(100% + 8px);
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 
        0 0 10px #fff,
        -4px -6px 14px #ff8c00,
        -8px 4px 18px #ff2200,
        0 0 25px #ff4500;
      filter: blur(1px);
      animation: flameTip 0.25s infinite alternate ease-in-out;
    }

    @keyframes fireGradient {
      0% { background-position: 0% 50%; box-shadow: 0 0 15px rgba(255, 69, 0, 0.6); }
      100% { background-position: 100% 50%; box-shadow: 0 -4px 22px rgba(255, 140, 0, 0.9), 0 0 35px rgba(255, 30, 0, 0.7); }
    }

    @keyframes flameTip {
      0% { transform: scale(1) translateY(0); opacity: 0.9; }
      100% { transform: scale(1.25) translateY(-2px); opacity: 1; filter: blur(0.5px); }
    }

    /* =========================================
       RACHA: PULSO DINÁMICO ESCALABLE
       ========================================= */
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .streak-badge.active-streak {
      animation: streakPulse calc(1.2s / var(--streak-intensity, 1)) infinite ease-in-out;
      color: #ff3e00;
      text-shadow: 0 0 calc(3px * var(--streak-intensity, 1)) rgba(255, 60, 0, 0.6);
    }

    @keyframes streakPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(calc(1 + (0.05 * var(--streak-intensity, 1))));
        filter: brightness(1.25);
      }
    }

    /* =========================================
       EFECTO SAD: PÉRDIDA DE RACHA (ASHES & SHAKE)
       ========================================= */
    .streak-lost-animation {
      animation: streakBreak 0.75s forwards cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes streakBreak {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.1); filter: grayscale(0.5) hue-rotate(180deg); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
      100% {
        transform: scale(0.85) translateY(4px);
        filter: grayscale(1) opacity(0.5);
      }
    }

    .smoke-particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.1rem;
      animation: smokeFade 1s forwards ease-out;
      z-index: 50;
    }

    @keyframes smokeFade {
      0% { transform: translateY(0) scale(1); opacity: 0.9; }
      100% { transform: translateY(-35px) scale(1.8) rotate(15deg); opacity: 0; filter: blur(3px); }
    }
  </style>
</head>

<body class="bg-auge-canvas text-auge-dark min-h-screen flex flex-col font-sans selection:bg-orange-100">

  <!-- Splash Screen Intro -->
  <div id="splashScreen" class="fixed inset-0 z-50 bg-[#FDFBF7] flex flex-col items-center justify-center p-6 transition-all duration-700 ease-out select-none">
    <div class="flex flex-col items-center text-center animate-splash max-w-md w-full">
      <div class="relative mb-6">
        <div class="absolute -inset-4 bg-gradient-to-tr from-orange-500/25 via-amber-400/30 to-orange-300/20 rounded-[2.5rem] blur-2xl animate-pulse"></div>
        <div class="relative w-44 h-44 sm:w-52 sm:h-52 bg-white rounded-3xl shadow-xl shadow-orange-950/10 border border-stone-200/70 p-3 flex items-center justify-center overflow-hidden">
          <img src="Auge_logovertical.jpg" alt="Auge Logo" class="w-full h-full object-contain">
        </div>
      </div>

      <span class="text-xs sm:text-sm uppercase tracking-[0.28em] font-extrabold text-auge-orange mb-1.5 drop-shadow-xs" id="splashBadge">
        Cargando
      </span>
      <h1 class="text-3xl sm:text-4xl font-black text-auge-dark tracking-tight leading-tight max-w-xs sm:max-w-sm" id="splashTitle">
        Aureka
      </h1>
      <div class="mt-5 flex items-center gap-2 text-stone-400 text-xs font-semibold">
        <span class="inline-block w-2 h-2 rounded-full bg-auge-orange animate-ping"></span>
        <span>Autogestión y Educación Comunitaria</span>
      </div>
    </div>
  </div>

  <!-- Header Fijo -->
  <header class="sticky top-0 z-30 w-full bg-auge-canvas/90 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="augeicon.png" alt="Logo Auge" class="w-8 h-8 object-contain rounded-lg shadow-sm" />
        <span class="font-black text-xl tracking-tight text-auge-dark">aureka</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="phaseBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 text-auge-gray border border-stone-200">
          Cargando...
        </span>
        <div class="flex items-center gap-1.5">
          <a 
            href="index.html" 
            title="Ir al menú de módulos" 
            class="text-xs font-medium text-stone-500 hover:text-auge-orange bg-stone-100 hover:bg-orange-50 border border-stone-200 hover:border-orange-200 px-2.5 py-1 rounded-full transition-colors flex items-center gap-1">
            <span>🏠</span> Inicio
          </a>
          <button 
            type="button" 
            onclick="confirmResetQuiz()" 
            title="Reiniciar sesión" 
            class="text-xs font-medium text-stone-500 hover:text-auge-orange bg-stone-100 hover:bg-orange-50 border border-stone-200 hover:border-orange-200 px-2.5 py-1 rounded-full transition-colors flex items-center gap-1">
            <span>🔄</span> Reiniciar
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenedor dinámico -->
  <main id="app" class="flex-1 w-full max-w-xl mx-auto px-4 py-6 flex flex-col justify-center"></main>

  <!-- Footer con Contador de visitas -->
  <footer class="w-full max-w-xl mx-auto px-4 py-4 border-t border-stone-200 text-xs text-stone-500 flex items-center justify-between">
    <span>Autogestión y Educación Comunitaria</span>
    <div id="visitContainer" class="flex items-center"></div>
  </footer>

  <!-- Motor principal con cargador modular -->
  <script>
    const MODULES_MAP = {
      1:  { name: "Técnicas de estudio & aprendizaje", file: "data/m1.js" },
      2:  { name: "Lectura & redacción I", file: "data/m2.js" },
      3:  { name: "Aritmética & álgebra", file: "data/m3.js" },
      4:  { name: "Sociología", file: "data/m4.js" },
      5:  { name: "Inglés I", file: "data/m5.js" },
      6:  { name: "Informática I", file: "data/m6.js" },
      7:  { name: "Lectura & redacción II", file: "data/m7.js" },
      8:  { name: "Física I", file: "data/m8.js" },
      9:  { name: "Ciencias naturales", file: "data/m9.js" },
      10: { name: "Estructura social mexicana", file: "data/m10.js" },
      11: { name: "Historia contemporánea", file: "data/m11.js" },
      12: { name: "Inglés II", file: "data/m12.js" },
      13: { name: "Lógica argumentativa", file: "data/m13.js" },
      14: { name: "Economía & sociedad", file: "data/m14.js" },
      15: { name: "Cálculo diferencial e integral", file: "data/m15.js" },
      16: { name: "Ciencias ambientales II", file: "data/m16.js" },
      17: { name: "Biología", file: "data/m17.js" },
      18: { name: "Probabilidad & estadística", file: "data/m18.js" },
      19: { name: "Física II", file: "data/m19.js" },
      20: { name: "Ciencias ambientales II", file: "data/m20.js" },
      21: { name: "Filosofía de la ciencia", file: "data/m21.js" },
      22: { name: "Informática II", file: "data/m22.js" }
    };

    const successPhrases = [
      "¡Excelente!",
      "¡Muy bien!",
      "¡Maestro!",
      "¡Impecable!",
      "¡Exacto!",
      "¡Perfecto!",
      "¡Crack!"
    ];

    let currentModuleId = "21";
    let currentQueue = [];
    let pendingQueue = [];
    let currentIndex = 0;
    let isReinforcementPhase = false;
    let failedTopics = new Set();

    let totalQuestions = 0;
    let firstRoundCorrect = 0;
    let secondRoundResolved = 0;
    let currentStreak = 0;
    let maxStreak = 0;

    const app = document.getElementById("app");
    const phaseBadge = document.getElementById("phaseBadge");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getRandomTonedStyle() {
      const hue = Math.floor(Math.random() * 360);
      return {
        style: `box-shadow: 0 4px 14px -2px hsla(${hue}, 45%, 55%, 0.16); border-color: hsla(${hue}, 30%, 82%, 1);`,
        activeStyle: `hsla(${hue}, 40%, 96%, 1)`
      };
    }

    function initQuiz() {
      failedTopics.clear();
      if (typeof questionBank === "undefined" || !Array.isArray(questionBank)) {
        app.innerHTML = `
          <div class="p-6 bg-white border border-red-200 rounded-2xl text-center">
            <h2 class="text-lg font-bold text-red-600">Error de datos</h2>
            <p class="text-sm text-stone-500 mt-2">No se encontró un banco de preguntas válido.</p>
          </div>
        `;
        return;
      }

      totalQuestions = questionBank.length;
      firstRoundCorrect = 0;
      secondRoundResolved = 0;
      currentStreak = 0;
      maxStreak = 0;
      pendingQueue = [];
      currentIndex = 0;
      isReinforcementPhase = false;

      currentQueue = shuffle(questionBank);

      const defaultBadge = (typeof moduleInfo !== "undefined" && moduleInfo.badge) 
        ? moduleInfo.badge 
        : `Módulo ${currentModuleId}`;

      phaseBadge.textContent = defaultBadge;
      phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 text-auge-gray border border-stone-200";
      
      renderQuestion();
    }

    function confirmResetQuiz() {
      if (confirm("¿Quieres reiniciar Aureka?")) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        initQuiz();
        initCounter(currentModuleId);
      }
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function toggleHint() {
      const box = document.getElementById("hintBox");
      const btn = document.getElementById("hintBtn");
      if (box && btn) {
        box.classList.toggle("hidden");
        btn.classList.add("opacity-50", "pointer-events-none");
        renderMath();
      }
    }

    /* CONTROL DE RACHA BALATRO */
    function handleStreakUpdate(isCorrect) {
      const streakEl = document.getElementById("streak-counter");
      const progressBarFill = document.querySelector(".progress-bar-fill");

      if (isCorrect) {
        currentStreak++;
        if (currentStreak > maxStreak) maxStreak = currentStreak;

        if (streakEl) {
          streakEl.classList.remove("streak-lost-animation", "hidden");
          const intensity = Math.min(1 + (currentStreak * 0.35), 4);
          streakEl.style.setProperty("--streak-intensity", intensity);
          streakEl.classList.add("active-streak");
          streakEl.innerHTML = `🔥 ${currentStreak}`;
        }

        if (progressBarFill && currentStreak >= 3) {
          progressBarFill.classList.add("on-fire");
        }
      } else {
        if (currentStreak >= 2 && streakEl) {
          triggerSadStreakLoss(streakEl);
        } else if (streakEl) {
          streakEl.classList.add("hidden");
        }

        currentStreak = 0;
        if (progressBarFill) progressBarFill.classList.remove("on-fire");
        if (streakEl) {
          streakEl.classList.remove("active-streak");
          streakEl.style.removeProperty("--streak-intensity");
        }
      }
    }

    function triggerSadStreakLoss(element) {
      element.classList.add("streak-lost-animation");
      element.innerHTML = `💨 0`;

      const rect = element.getBoundingClientRect();
      const smoke = document.createElement("span");
      smoke.className = "smoke-particle";
      smoke.innerText = "☁️";
      smoke.style.left = `${rect.left + window.scrollX + 6}px`;
      smoke.style.top = `${rect.top + window.scrollY - 10}px`;
      document.body.appendChild(smoke);

      setTimeout(() => {
        smoke.remove();
        element.classList.add("hidden");
      }, 1000);
    }

    function renderQuestion() {
      if (currentIndex >= currentQueue.length) {
        handlePhaseCompletion();
        return;
      }

      const q = currentQueue[currentIndex];
      const progressPercent = Math.round(((currentIndex) / currentQueue.length) * 100);
      const isFireActive = currentStreak >= 3;
      const intensity = Math.min(1 + (currentStreak * 0.35), 4);

      let contentHTML = `
        <div class="animate-pop bg-white border border-stone-200 rounded-2xl p-6 shadow-sm flex flex-col gap-5">
          <!-- Barra progreso y racha -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between text-xs font-bold">
              <span class="text-auge-orange uppercase tracking-wider">Pregunta ${currentIndex + 1} de ${currentQueue.length}</span>
              <span id="streak-counter" class="streak-badge ${currentStreak > 1 ? 'active-streak' : 'hidden'} text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200" style="--streak-intensity: ${intensity}">
                🔥 ${currentStreak}
              </span>
            </div>
            <div class="progress-bar-container w-full bg-stone-100 h-2.5 rounded-full transition-all">
              <div class="bg-auge-orange h-full rounded-full progress-bar-fill ${isFireActive ? 'on-fire' : ''}" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <!-- Prompt -->
          <div>
            <h2 class="text-xl font-bold text-auge-dark mt-0.5 leading-snug">${q.prompt}</h2>
          </div>

          ${q.images || q.image ? `
          <div class="w-full bg-stone-50 border border-stone-200 rounded-xl overflow-hidden p-2">
            <div class="${(Array.isArray(q.images) && q.images.length > 1) ? 'grid grid-cols-1 sm:grid-cols-2 gap-2' : 'flex justify-center'}">
              ${(Array.isArray(q.images) ? q.images : (Array.isArray(q.image) ? q.image : [q.image])).map(src => `
                <img src="${src}" alt="Material gráfico de apoyo" class="w-full max-h-64 object-contain rounded-lg bg-white border border-stone-100" loading="lazy" />
              `).join('')}
            </div>
          </div>
        ` : ''}

          <!-- Botón y Caja de Pista -->
          ${q.hint ? `
            <div class="flex flex-col items-start gap-2">
              <button type="button" onclick="toggleHint()" id="hintBtn" class="text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors">
                <span>💡</span> ¿Necesitas una pista?
              </button>
              <div id="hintBox" class="hidden w-full p-3 bg-amber-50/80 border border-amber-200/90 rounded-xl text-xs text-amber-900 leading-relaxed animate-pop">
                <span class="font-bold">Pista:</span> ${q.hint}
              </div>
            </div>
          ` : ''}

          <!-- Opciones según tipo -->
          <div id="optionsContainer" class="flex flex-col gap-3 pt-1"></div>

          <!-- Feedback & Botón siguiente -->
          <div id="feedbackContainer" class="hidden flex-col gap-3 border-t border-stone-100 pt-4 mt-2">
            <div id="feedbackBox" class="p-3.5 rounded-xl text-sm leading-relaxed"></div>
            <button id="nextBtn" class="w-full py-3 rounded-xl bg-auge-orange hover:bg-auge-darkOrange font-bold text-white transition-colors shadow-sm">
              Continuar
            </button>
          </div>
        </div>
      `;

      app.innerHTML = contentHTML;
      const optionsContainer = document.getElementById("optionsContainer");

      if (q.type === "choice") {
        const options = shuffle([q.correct, ...q.distractors]);
        options.forEach(opt => {
          const tone = getRandomTonedStyle();
          const btn = document.createElement("button");
          btn.className = "choice-btn w-full p-3.5 text-left bg-white border-2 rounded-xl font-medium transition-all text-sm sm:text-base active:scale-[0.99]";
          btn.style.cssText = tone.style;
          btn.innerHTML = opt;
          btn.onclick = () => handleChoiceAnswer(btn, opt, q);
          optionsContainer.appendChild(btn);
        });
      } else if (q.type === "drag_order") {
        const scrambled = shuffle(q.correctOrder);
        const list = document.createElement("div");
        list.id = "sortableList";
        list.className = "flex flex-col gap-2.5 cursor-grab";

        scrambled.forEach(item => {
          const tone = getRandomTonedStyle();
          const el = document.createElement("div");
          el.className = "drag-item p-3.5 bg-white border rounded-xl font-medium text-sm flex items-center justify-between";
          el.style.cssText = tone.style;
          el.innerHTML = `<span>${item}</span><span class="text-stone-400">☰</span>`;
          el.dataset.value = item;
          list.appendChild(el);
        });

        optionsContainer.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 mt-2 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar orden";
        checkBtn.onclick = () => handleDragAnswer(list, q, checkBtn);
        optionsContainer.appendChild(checkBtn);

        new Sortable(list, {
          animation: 150,
          ghostClass: 'opacity-40'
        });
      } else if (q.type === "multi_select") {
        const allOptions = shuffle([...q.correctAnswers, ...q.distractors]);
        const list = document.createElement("div");
        list.className = "flex flex-col gap-2.5";

        allOptions.forEach(opt => {
          const tone = getRandomTonedStyle();
          const item = document.createElement("div");
          item.className = "multi-select-item p-3.5 bg-white border-2 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between cursor-pointer transition-all active:scale-[0.99]";
          item.style.cssText = tone.style;
          item.dataset.value = opt;
          item.dataset.selected = "false";
          item.innerHTML = `<span class="flex-1 pr-3 text-left leading-snug">${opt}</span><span class="checkbox-indicator w-5 h-5 rounded-md border-2 border-stone-300 flex items-center justify-center text-xs text-white font-bold transition-all shrink-0 aspect-square"></span>`;

          item.onclick = () => {
            const isSel = item.dataset.selected === "true";
            item.dataset.selected = isSel ? "false" : "true";
            const indicator = item.querySelector(".checkbox-indicator");
            if (!isSel) {
              item.classList.add("!border-auge-orange", "!bg-orange-50/50");
              indicator.classList.add("bg-auge-orange", "border-auge-orange");
              indicator.textContent = "✓";
            } else {
              item.classList.remove("!border-auge-orange", "!bg-orange-50/50");
              indicator.classList.remove("bg-auge-orange", "border-auge-orange");
              indicator.textContent = "";
            }
          };

          list.appendChild(item);
        });

        optionsContainer.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 mt-2 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Confirmar respuestas";
        checkBtn.onclick = () => handleMultiSelectAnswer(list, q, checkBtn);
        optionsContainer.appendChild(checkBtn);
      } else if (q.type === "classification") {
        const list = document.createElement("div");
        list.className = "flex flex-col gap-3";
        const shuffledItems = shuffle(q.items);

        shuffledItems.forEach(item => {
          const tone = getRandomTonedStyle();
          const row = document.createElement("div");
          row.className = "classification-item p-3.5 bg-white border-2 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3";
          row.style.cssText = tone.style;
          row.dataset.correct = item.correct;
          row.dataset.selected = "";

          row.innerHTML = `
            <span class="text-sm font-medium leading-snug w-full text-stone-800">${item.text}</span>
            <div class="grid grid-cols-2 gap-1.5 w-full pt-1.5 border-t border-stone-100/80">
              ${q.categories.map(cat => `
                <button type="button" class="tag-btn text-center text-xs font-semibold px-2 py-1.5 rounded-lg border border-stone-300 bg-stone-50 hover:bg-stone-100 text-stone-600 transition-all active:scale-95">
                  ${cat}
                </button>
              `).join('')}
            </div>
          `;

          const tagButtons = row.querySelectorAll(".tag-btn");
          tagButtons.forEach(btn => {
            btn.onclick = () => {
              tagButtons.forEach(b => {
                b.className = "tag-btn text-xs font-semibold px-3 py-1.5 rounded-lg border border-stone-300 bg-stone-50 text-stone-600 hover:bg-stone-100 transition-all";
              });
              btn.className = "tag-btn text-xs font-semibold px-3 py-1.5 rounded-lg border-2 border-auge-orange bg-auge-orange text-white shadow-sm transition-all";
              row.dataset.selected = btn.textContent.trim();
            };
          });

          list.appendChild(row);
        });

        optionsContainer.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 mt-2 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar clasificación";
        checkBtn.onclick = () => handleClassificationAnswer(list, q, checkBtn);
        optionsContainer.appendChild(checkBtn);
      } else if (q.type === "fill_blanks") {
        const blanksContainer = document.createElement("div");
        blanksContainer.className = "flex flex-col gap-5";

        const allTokens = shuffle([...q.correctOrder, ...(q.distractors || [])]).map((text, i) => ({
          id: `token_${i}_${Math.random().toString(36).substr(2, 4)}`,
          text: text
        }));

        const slotsState = new Array(q.correctOrder.length).fill(null);
        let activeSlotIndex = 0;

        const sentenceBox = document.createElement("div");
        sentenceBox.className = "p-4 sm:p-5 bg-stone-50/70 border border-stone-200 rounded-xl leading-loose text-base font-medium text-auge-dark select-none";

        let formattedSentence = q.sentence;
        q.correctOrder.forEach((_, idx) => {
          formattedSentence = formattedSentence.replace(
            `{${idx}}`,
            `<span class="blank-slot inline-flex items-center justify-center min-w-[90px] h-[34px] px-3 mx-1 border-2 border-dashed border-stone-300 bg-white/80 rounded-lg text-sm font-semibold align-middle cursor-pointer transition-all hover:border-auge-orange" data-slot="${idx}"></span>`
          );
        });
        sentenceBox.innerHTML = formattedSentence;
        blanksContainer.appendChild(sentenceBox);

        const poolTitle = document.createElement("div");
        poolTitle.className = "text-xs font-bold uppercase tracking-wider text-stone-400 -mb-2";
        poolTitle.textContent = "Opciones:";
        blanksContainer.appendChild(poolTitle);

        const poolContainer = document.createElement("div");
        poolContainer.id = "tokensPool";
        poolContainer.className = "flex flex-wrap gap-2 p-3 bg-white border border-stone-200 rounded-xl min-h-[56px] items-center";
        blanksContainer.appendChild(poolContainer);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar respuesta";
        checkBtn.onclick = () => handleFillBlanksAnswer(slotsState, q, checkBtn, blanksContainer);
        blanksContainer.appendChild(checkBtn);

        optionsContainer.appendChild(blanksContainer);

        function renderPool() {
          poolContainer.innerHTML = "";
          allTokens.forEach(token => {
            const isUsed = slotsState.some(s => s && s.id === token.id);
            if (!isUsed) {
              const chip = document.createElement("button");
              chip.type = "button";
              chip.className = "token-chip px-3.5 py-1.5 bg-white hover:bg-orange-50 border-2 border-stone-200 hover:border-auge-orange rounded-lg text-sm font-semibold text-auge-dark shadow-sm active:scale-95 transition-all";
              chip.innerHTML = token.text;
              chip.onclick = () => placeOrReplaceToken(token);
              poolContainer.appendChild(chip);
            }
          });
          renderMath();
        }

        function updateSlotsDisplay() {
          const slotElements = sentenceBox.querySelectorAll(".blank-slot");
          slotElements.forEach(el => {
            const slotIdx = parseInt(el.dataset.slot, 10);
            const currentToken = slotsState[slotIdx];
            const isActive = slotIdx === activeSlotIndex;

            if (currentToken) {
              el.className = `blank-slot inline-flex items-center justify-center min-w-[90px] h-[34px] px-3 mx-1 border-2 border-auge-orange bg-orange-50 text-auge-orange font-bold rounded-lg text-sm cursor-pointer shadow-sm animate-pop align-middle ${isActive ? 'ring-2 ring-auge-orange/30' : ''}`;
              el.innerHTML = `<span>${currentToken.text}</span>`;
              el.onclick = () => {
                slotsState[slotIdx] = null;
                activeSlotIndex = slotIdx;
                updateSlotsDisplay();
                renderPool();
              };
            } else {
              el.className = `blank-slot inline-flex items-center justify-center min-w-[90px] h-[34px] px-3 mx-1 border-2 border-dashed rounded-lg text-sm align-middle cursor-pointer transition-all ${
                isActive 
                  ? 'border-auge-orange bg-orange-50/40 ring-2 ring-orange-200 shadow-sm' 
                  : 'border-stone-300 bg-white/90 hover:border-stone-400'
              }`;
              el.innerHTML = `<span class="w-6 h-0.5 rounded-full ${isActive ? 'bg-auge-orange/60' : 'bg-stone-200'}"></span>`;
              el.onclick = () => {
                activeSlotIndex = slotIdx;
                updateSlotsDisplay();
              };
            }
          });
          renderMath();
        }

        function placeOrReplaceToken(token) {
          if (slotsState[activeSlotIndex] === null) {
            slotsState[activeSlotIndex] = token;
          } else {
            const freeIdx = slotsState.findIndex(s => s === null);
            if (freeIdx !== -1) {
              slotsState[freeIdx] = token;
              activeSlotIndex = freeIdx;
            } else {
              slotsState[activeSlotIndex] = token;
            }
          }

          const nextFree = slotsState.findIndex(s => s === null);
          if (nextFree !== -1) {
            activeSlotIndex = nextFree;
          }

          updateSlotsDisplay();
          renderPool();
        }

        renderPool();
        updateSlotsDisplay();
      } else if (q.type === "match_columns") {
        const matchContainer = document.createElement("div");
        matchContainer.className = "flex flex-col gap-4 relative";

        const leftItems = q.pairs.map((p, i) => ({ id: `L_${i}`, text: p.left, pairIndex: i }));
        const rightItems = shuffle(q.pairs.map((p, i) => ({ id: `R_${i}`, text: p.right, pairIndex: i })));

        const connections = {};
        let selectedLeftId = null;

        const pairColors = [
          { bg: "bg-amber-50", border: "border-amber-400", text: "text-amber-900", badge: "bg-amber-500", hex: "#f59e0b" },
          { bg: "bg-blue-50", border: "border-blue-400", text: "text-blue-900", badge: "bg-blue-500", hex: "#3b82f6" },
          { bg: "bg-purple-50", border: "border-purple-400", text: "text-purple-900", badge: "bg-purple-500", hex: "#a855f7" },
          { bg: "bg-rose-50", border: "border-rose-400", text: "text-rose-900", badge: "bg-rose-500", hex: "#f43f5e" },
          { bg: "bg-teal-50", border: "border-teal-400", text: "text-teal-900", badge: "bg-teal-500", hex: "#14b8a6" },
          { bg: "bg-indigo-50", border: "border-indigo-400", text: "text-indigo-900", badge: "bg-indigo-500", hex: "#6366f1" }
        ];

        const headerGrid = document.createElement("div");
        headerGrid.className = "grid grid-cols-2 gap-2 text-xs font-bold uppercase tracking-wider text-stone-400 px-1 select-none";
        headerGrid.innerHTML = `
          <div class="flex items-center gap-1"><span></span> Columna A</div>
          <div class="flex items-center gap-1 justify-end sm:justify-start"><span></span> Columna B</div>
        `;
        matchContainer.appendChild(headerGrid);

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-2 gap-2.5 sm:gap-3 items-center relative";

        const colLeft = document.createElement("div");
        colLeft.className = "flex flex-col gap-2.5 justify-center";

        const colRight = document.createElement("div");
        colRight.className = "flex flex-col gap-2.5 justify-center";

        grid.appendChild(colLeft);
        grid.appendChild(colRight);
        matchContainer.appendChild(grid);

        const svgCanvas = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svgCanvas.setAttribute("class", "absolute inset-0 w-full h-full pointer-events-none z-20");
        grid.appendChild(svgCanvas);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors mt-2";
        checkBtn.textContent = "Comprobar relaciones";
        checkBtn.onclick = () => handleMatchColumnsAnswer(connections, leftItems, rightItems, q, checkBtn, matchContainer);
        matchContainer.appendChild(checkBtn);

        optionsContainer.appendChild(matchContainer);

        function drawZapLine(leftPinEl, rightPinEl, strokeHex) {
          if (!leftPinEl || !rightPinEl) return;
          const gridRect = grid.getBoundingClientRect();
          const lRect = leftPinEl.getBoundingClientRect();
          const rRect = rightPinEl.getBoundingClientRect();

          const x1 = (lRect.left + lRect.width / 2) - gridRect.left;
          const y1 = (lRect.top + lRect.height / 2) - gridRect.top;
          const x2 = (rRect.left + rRect.width / 2) - gridRect.left;
          const y2 = (rRect.top + rRect.height / 2) - gridRect.top;

          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", x1);
          line.setAttribute("y1", y1);
          line.setAttribute("x2", x2);
          line.setAttribute("y2", y2);
          line.setAttribute("stroke", strokeHex);
          line.setAttribute("stroke-width", "3");
          line.setAttribute("stroke-linecap", "round");
          line.setAttribute("class", "zap-line");

          svgCanvas.appendChild(line);
          setTimeout(() => line.remove(), 460);
        }

        function renderMatchView() {
          colLeft.innerHTML = "";
          colRight.innerHTML = "";

          leftItems.forEach((item, idx) => {
            const isSelected = selectedLeftId === item.id;
            const connectedRightId = connections[item.id];
            const hasConnection = Boolean(connectedRightId);

            const card = document.createElement("button");
            card.type = "button";
            card.dataset.id = item.id;

            let styleClasses = "relative p-3 rounded-xl border-2 text-left text-xs sm:text-sm font-semibold transition-all shadow-sm flex flex-col justify-between min-h-[76px] ";

            if (isSelected) {
              styleClasses += "border-auge-orange bg-orange-50 ring-2 ring-orange-200 text-auge-dark scale-[1.02]";
            } else if (hasConnection) {
              const colorTheme = pairColors[idx % pairColors.length];
              styleClasses += `${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}`;
            } else {
              styleClasses += "border-stone-200 bg-white hover:border-stone-300 text-auge-dark";
            }

            card.className = styleClasses;
            card.innerHTML = `
              <span class="leading-snug pr-3">${item.text}</span>
              <div class="flex items-center justify-between w-full mt-2 pt-1 border-t border-black/5 text-[11px]">
                ${hasConnection 
                  ? `<span class="font-bold text-emerald-700 flex items-center gap-1">✓ Enlazado</span>` 
                  : (isSelected ? `<span class="text-auge-orange animate-pulse font-bold">Unir con 👉</span>` : `<span class="text-stone-400 font-normal">Toca para unir</span>`)
                }
                <span id="pin_${item.id}" class="w-3 h-3 rounded-full ${hasConnection ? pairColors[idx % pairColors.length].badge : (isSelected ? 'bg-auge-orange animate-ping' : 'bg-stone-300')} shrink-0 transition-transform"></span>
              </div>
            `;

            card.onclick = () => {
              if (connections[item.id]) {
                delete connections[item.id];
                selectedLeftId = null;
              } else {
                selectedLeftId = (selectedLeftId === item.id) ? null : item.id;
              }
              renderMatchView();
            };

            colLeft.appendChild(card);
          });

          rightItems.forEach(item => {
            const connectedLeftEntry = Object.entries(connections).find(([_, rId]) => rId === item.id);
            const connectedLeftId = connectedLeftEntry ? connectedLeftEntry[0] : null;
            const leftIdx = connectedLeftId ? leftItems.findIndex(l => l.id === connectedLeftId) : -1;

            const card = document.createElement("button");
            card.type = "button";
            card.dataset.id = item.id;

            let styleClasses = "relative p-3 rounded-xl border-2 text-left text-xs sm:text-sm font-medium transition-all shadow-sm flex flex-col justify-between min-h-[76px] ";

            if (connectedLeftId) {
              const colorTheme = pairColors[leftIdx % pairColors.length];
              styleClasses += `${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}`;
            } else {
              styleClasses += selectedLeftId 
                ? "border-orange-200 bg-orange-50/40 hover:border-auge-orange text-stone-700 cursor-pointer" 
                : "border-stone-200 bg-white hover:border-stone-300 text-auge-dark";
            }

            card.className = styleClasses;
            card.innerHTML = `
              <span class="leading-snug pl-1">${item.text}</span>
              <div class="flex items-center justify-between w-full mt-2 pt-1 border-t border-black/5 text-[11px]">
                <span id="pin_${item.id}" class="w-3 h-3 rounded-full ${connectedLeftId ? pairColors[leftIdx % pairColors.length].badge : 'bg-stone-300'} shrink-0 transition-transform"></span>
                ${connectedLeftId 
                  ? `<span class="font-bold text-emerald-700">✓ Conectado</span>` 
                  : `<span class="text-stone-400 font-normal">Une aquí</span>`
                }
              </div>
            `;

            card.onclick = () => {
              if (connectedLeftId) {
                delete connections[connectedLeftId];
                renderMatchView();
                return;
              }

              if (selectedLeftId) {
                const sourceLeftId = selectedLeftId;
                const sourceIdx = leftItems.findIndex(l => l.id === sourceLeftId);
                const theme = pairColors[sourceIdx % pairColors.length];

                connections[sourceLeftId] = item.id;
                selectedLeftId = null;

                renderMatchView();

                setTimeout(() => {
                  const leftPin = document.getElementById(`pin_${sourceLeftId}`);
                  const rightPin = document.getElementById(`pin_${item.id}`);
                  drawZapLine(leftPin, rightPin, theme.hex);
                }, 10);
              }
            };

            colRight.appendChild(card);
          });

          renderMath();
        }

        renderMatchView();
      }

      renderMath();
    }

    function handleChoiceAnswer(selectedBtn, selectedText, question) {
      const buttons = document.querySelectorAll(".choice-btn");
      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = selectedText === question.correct;
      handleStreakUpdate(isCorrect);

      if (isCorrect) {
        selectedBtn.classList.add("!bg-emerald-50", "!border-emerald-500", "!text-emerald-900", "animate-success");
        selectedBtn.style.boxShadow = "0 4px 14px -2px rgba(16, 185, 129, 0.3)";
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
      } else {
        selectedBtn.classList.add("!bg-red-50", "!border-red-400", "!text-red-900", "animate-shake");  
        selectedBtn.style.boxShadow = "0 4px 14px -2px rgba(239, 68, 68, 0.3)";
        buttons.forEach(btn => {
          if (btn.textContent.trim() === question.correct.replace(/<[^>]*>?/gm, '').trim()) {
            btn.classList.add("!bg-emerald-50", "!border-emerald-500", "!text-emerald-900");
          }
        });
        queueForReinforcement(question);
      }

      showFeedback(isCorrect, question.explanation);
    }

    function handleDragAnswer(listElement, question, triggerBtn) {
      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");

      const items = Array.from(listElement.children).map(child => child.dataset.value);
      const isCorrect = items.every((val, idx) => val === question.correctOrder[idx]);
      handleStreakUpdate(isCorrect);

      if (isCorrect) {
        listElement.classList.add("pointer-events-none");
        Array.from(listElement.children).forEach(c => {
          c.classList.add("!bg-emerald-50", "!border-emerald-500", "!text-emerald-900");
        });
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
      } else {
        listElement.classList.add("pointer-events-none");
        Array.from(listElement.children).forEach(c => {
          c.classList.add("!bg-red-50", "!border-red-300", "!text-red-900");
        });
        queueForReinforcement(question);
      }

      showFeedback(isCorrect, question.explanation);
    }

    function handleMultiSelectAnswer(listElement, question, triggerBtn) {
      const items = Array.from(listElement.children);
      const selectedValues = items
        .filter(el => el.dataset.selected === "true")
        .map(el => el.dataset.value);

      if (selectedValues.length === 0) {
        alert("Por favor selecciona al menos una opción.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      listElement.classList.add("pointer-events-none");

      const correctSet = new Set(question.correctAnswers);
      const hasAllCorrect = question.correctAnswers.every(ans => selectedValues.includes(ans));
      const hasNoExtras = selectedValues.every(ans => correctSet.has(ans));
      const isCorrect = hasAllCorrect && hasNoExtras;
      handleStreakUpdate(isCorrect);

      items.forEach(el => {
        const val = el.dataset.value;
        const isAnswer = correctSet.has(val);
        const wasSelected = el.dataset.selected === "true";
        const indicator = el.querySelector(".checkbox-indicator");

        el.style.boxShadow = "none";

        if (isAnswer && wasSelected) {
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border-2 border-emerald-500 bg-emerald-50 text-emerald-950";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md bg-emerald-600 border border-emerald-600 flex items-center justify-center text-xs text-white font-black shrink-0 aspect-square";
          indicator.textContent = "✓";
        } else if (!isAnswer && wasSelected) {
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border-2 border-red-500 bg-red-50 text-red-950 line-through decoration-red-400";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md bg-red-600 border border-red-600 flex items-center justify-center text-xs text-white font-black shrink-0 aspect-square";
          indicator.textContent = "✕";
        } else if (isAnswer && !wasSelected) {
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border-2 border-dashed border-emerald-500 bg-emerald-50/50 text-emerald-900";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md border-2 border-dashed border-emerald-500 bg-white flex items-center justify-center text-xs text-emerald-600 font-bold shrink-0 aspect-square";
          indicator.textContent = "✓";
        } else {
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border border-stone-200 bg-stone-50 text-stone-400 opacity-60";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md border border-stone-300 bg-stone-100 flex items-center justify-center shrink-0 aspect-square";
          indicator.textContent = "";
        }
      });

      if (isCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
      } else {
        queueForReinforcement(question);
        listElement.classList.add("animate-shake");
      }

      showFeedback(isCorrect, question.explanation);
    }

    function handleClassificationAnswer(listElement, question, triggerBtn) {
      const rows = Array.from(listElement.children);
      const allSelected = rows.every(r => r.dataset.selected !== "");

      if (!allSelected) {
        alert("Por favor clasifica todos los enunciados antes de continuar.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      listElement.classList.add("pointer-events-none");

      let isAllCorrect = true;

      rows.forEach(r => {
        const isMatch = r.dataset.selected === r.dataset.correct;
        const buttons = r.querySelectorAll(".tag-btn");

        if (!isMatch) {
          isAllCorrect = false;
          r.classList.add("!bg-red-50/60", "!border-red-400");
        } else {
          r.classList.add("!bg-emerald-50/60", "!border-emerald-500");
        }

        buttons.forEach(btn => {
          const val = btn.textContent.trim();
          if (val === r.dataset.correct) {
            btn.classList.add("!bg-emerald-600", "!border-emerald-600", "!text-white");
          } else if (val === r.dataset.selected && !isMatch) {
            btn.classList.add("!bg-red-500", "!border-red-500", "!text-white");
          }
        });
      });

      handleStreakUpdate(isAllCorrect);

      if (isAllCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
      } else {
        queueForReinforcement(question);
        listElement.classList.add("animate-shake");
      }

      showFeedback(isAllCorrect, question.explanation);
    }

    function handleFillBlanksAnswer(slotsState, question, triggerBtn, containerElement) {
      const hasEmpty = slotsState.some(s => s === null);
      if (hasEmpty) {
        alert("Por favor completa todos los espacios antes de comprobar.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      containerElement.classList.add("pointer-events-none");

      const isAllCorrect = slotsState.every((token, idx) => token.text === question.correctOrder[idx]);
      handleStreakUpdate(isAllCorrect);

      const slotElements = containerElement.querySelectorAll(".blank-slot");
      slotElements.forEach((el, idx) => {
        const isSlotCorrect = slotsState[idx].text === question.correctOrder[idx];
        if (isSlotCorrect) {
          el.className = "blank-slot inline-flex items-center justify-center min-w-[80px] px-2.5 py-1 mx-1 border-2 border-emerald-500 bg-emerald-50 text-emerald-950 font-black rounded-lg text-sm shadow-sm align-middle";
          el.innerHTML = `${slotsState[idx].text} <span class="ml-1 text-emerald-600">✓</span>`;
        } else {
          el.className = "blank-slot inline-flex items-center justify-center min-w-[80px] px-2.5 py-1 mx-1 border-2 border-red-500 bg-red-50 text-red-950 line-through decoration-red-500 font-black rounded-lg text-sm shadow-sm align-middle";
          el.innerHTML = `${slotsState[idx].text} <span class="ml-1 text-red-600">✕</span>`;
        }
      });

      if (isAllCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
      } else {
        queueForReinforcement(question);
        containerElement.classList.add("animate-shake");
      }

      showFeedback(isAllCorrect, question.explanation);
    }

    function handleMatchColumnsAnswer(connections, leftItems, rightItems, question, triggerBtn, containerElement) {
      const totalPairs = leftItems.length;
      if (Object.keys(connections).length < totalPairs) {
        alert("Por favor relaciona todos los elementos antes de comprobar.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      containerElement.classList.add("pointer-events-none");

      let isAllCorrect = true;

      leftItems.forEach(lItem => {
        const connectedRightId = connections[lItem.id];
        const rItem = rightItems.find(r => r.id === connectedRightId);
        const isPairMatch = lItem.pairIndex === rItem.pairIndex;

        const leftEl = containerElement.querySelector(`[data-id="${lItem.id}"]`);
        const rightEl = containerElement.querySelector(`[data-id="${rItem.id}"]`);

        if (isPairMatch) {
          leftEl.className = "p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-950 text-sm font-semibold flex items-center justify-between";
          rightEl.className = "p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-950 text-sm font-semibold flex items-center justify-between";
          leftEl.innerHTML = `<span class="flex-1">${lItem.text}</span><span class="text-emerald-600 font-black">✓</span>`;
          rightEl.innerHTML = `<span class="flex-1">${rItem.text}</span><span class="text-emerald-600 font-black">✓</span>`;
        } else {
          isAllCorrect = false;
          leftEl.className = "p-3 rounded-xl border-2 border-red-500 bg-red-50 text-red-950 text-sm font-semibold flex items-center justify-between";
          rightEl.className = "p-3 rounded-xl border-2 border-red-500 bg-red-50 text-red-950 text-sm font-semibold flex items-center justify-between";
          leftEl.innerHTML = `<span class="flex-1">${lItem.text}</span><span class="text-red-600 font-black">✕</span>`;
          rightEl.innerHTML = `<span class="flex-1">${rItem.text}</span><span class="text-red-600 font-black">✕</span>`;
        }
      });

      handleStreakUpdate(isAllCorrect);

      if (isAllCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
      } else {
        queueForReinforcement(question);
        containerElement.classList.add("animate-shake");
      }

      showFeedback(isAllCorrect, question.explanation);
    }

    function queueForReinforcement(question) {
      if (question.topicId) {
        failedTopics.add(question.topicId);
      }
      if (!isReinforcementPhase && !pendingQueue.some(item => item.id === question.id)) {
        pendingQueue.push(question);
      }
    }

    function showFeedback(isCorrect, explanation) {
      const container = document.getElementById("feedbackContainer");
      const box = document.getElementById("feedbackBox");
      const nextBtn = document.getElementById("nextBtn");

      container.classList.remove("hidden");
      container.classList.add("flex");

      if (isCorrect) {
        const randomPhrase = successPhrases[Math.floor(Math.random() * successPhrases.length)];
        box.className = "p-3.5 rounded-xl text-sm leading-relaxed bg-emerald-50 text-emerald-950 border border-emerald-200";
        box.innerHTML = `<span class="font-bold text-emerald-700">${randomPhrase}</span><br>${explanation}`;
      } else {
        box.className = "p-3.5 rounded-xl text-sm leading-relaxed bg-stone-100 text-auge-dark border border-stone-200";
        box.innerHTML = `<span class="font-bold text-auge-orange">Concepto a reforzar:</span><br>${explanation}`;
      }

      nextBtn.onclick = () => {
        currentIndex++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      renderMath();

      setTimeout(() => {
        container.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    }

    function handlePhaseCompletion() {
      if (!isReinforcementPhase && pendingQueue.length > 0) {
        currentQueue = shuffle(pendingQueue);
        pendingQueue = [];
        currentIndex = 0;
        isReinforcementPhase = true;

        phaseBadge.textContent = "Segunda vuelta";
        phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-100 text-auge-orange border border-orange-200";

        app.innerHTML = `
          <div class="animate-pop bg-white border border-stone-200 rounded-2xl p-6 text-center shadow-sm flex flex-col items-center gap-4">
            <img src="augeicon.png" alt="Logo Auge" class="w-12 h-12 object-contain" />
            <div>
              <h2 class="text-xl font-bold text-auge-dark">Segunda vuelta</h2>
              <p class="text-sm text-auge-gray mt-1 max-w-sm mx-auto">
                Vamos a darle una pasada a las preguntas que tuvieron detalle para consolidarlas antes de cerrar el módulo.
              </p>
            </div>
            <button onclick="renderQuestion()" class="w-full py-3 mt-2 rounded-xl bg-auge-orange hover:bg-auge-darkOrange text-white font-bold text-sm tracking-wide transition-colors shadow-sm">
              Iniciar repaso (${currentQueue.length})
            </button>
          </div>
        `;
      } else {
        renderFinalScore();
      }
    }

    function renderFinalScore() {
      phaseBadge.textContent = "Completado";
      phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200";

      if (window.confetti) {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.65 },
          colors: ['#F17D4B', '#D96534', '#10B981', '#FBBF24']
        });
      }

      const prelimGrade = totalQuestions > 0 ? ((firstRoundCorrect / totalQuestions) * 10).toFixed(1) : "0.0";

      const videosMap = (typeof moduleInfo !== "undefined" && moduleInfo.topicVideos) ? moduleInfo.topicVideos : {};
      const recommendedVideos = Array.from(failedTopics)
        .map(topicId => videosMap[topicId])
        .filter(Boolean);

      let videoSectionHTML = "";
      if (recommendedVideos.length > 0) {
        videoSectionHTML = `
          <div class="w-full bg-orange-50/70 border border-orange-200 rounded-xl p-4 text-left flex flex-col gap-2.5 mt-1">
            <div class="flex items-center gap-2">
              <span class="text-base">📺</span>
              <span class="text-xs font-bold uppercase tracking-wider text-auge-orange">Videos recomendados para ti</span>
            </div>
            <p class="text-xs text-stone-600 leading-relaxed">
              Estas son algunas áreas que podemos mejorar de acuerdo a tus respuestas. Revisa estas explicaciones en video antes de tu examen:
            </p>
            <div class="flex flex-col gap-2 mt-1">
              ${recommendedVideos.map(vid => `
                <a href="${vid.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between gap-3 p-3 bg-white hover:bg-orange-50/80 border border-orange-200/80 rounded-xl text-xs font-semibold text-auge-dark hover:text-auge-orange transition-all group shadow-xs">
                  <div class="flex items-start gap-2.5 min-w-0 flex-1">
                    <span class="text-red-600 text-sm leading-none mt-0.5 group-hover:scale-110 transition-transform shrink-0">▶</span>
                    <span class="leading-snug break-words">${vid.title}</span>
                  </div>
                  <span class="text-[11px] font-bold text-auge-orange bg-orange-50 border border-orange-200 group-hover:bg-auge-orange group-hover:text-white px-2.5 py-1 rounded-lg transition-colors shrink-0 whitespace-nowrap">
                    Ver ↗
                  </span>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="animate-pop bg-white border border-stone-200 rounded-2xl p-6 sm:p-8 text-center shadow-sm flex flex-col items-center gap-5">
          <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-2xl font-bold">
            ✓
          </div>
          
          <div>
            <h2 class="text-2xl font-bold text-auge-dark">¡Módulo concluido!</h2>
            <p class="text-sm text-auge-gray mt-1">Has respondido el 100% de los reactivos de esta sesión.</p>
          </div>

          <div class="w-full grid grid-cols-2 gap-3 mt-1">
            <div class="bg-stone-50 border border-stone-200 rounded-xl p-3.5 flex flex-col items-center justify-center">
              <span class="text-xs text-stone-500 font-medium">Aciertos (1ª ronda)</span>
              <span class="text-2xl font-black text-auge-dark mt-0.5">${firstRoundCorrect} / ${totalQuestions}</span>
            </div>

            <div class="bg-orange-50/60 border border-orange-200/80 rounded-xl p-3.5 flex flex-col items-center justify-center">
              <span class="text-xs text-auge-orange font-bold uppercase tracking-wider">Calificación Inicial</span>
              <span class="text-2xl font-black text-auge-dark mt-0.5">${prelimGrade} <span class="text-sm font-semibold text-stone-500">/ 10</span></span>
            </div>
          </div>

          <div class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-xs text-stone-600 text-left leading-relaxed flex flex-col gap-1">
            <div>• <b>Aciertos rescatados en segunda vuelta:</b> ${secondRoundResolved} de ${totalQuestions - firstRoundCorrect} pendientes.</div>
            <div>• <b>Mejor racha consecutiva:</b> 🔥 ${maxStreak} reactivos seguidos.</div>
            <div>• <b>Aciertos totales logrados:</b> ${firstRoundCorrect + secondRoundResolved} / ${totalQuestions}.</div>
          </div>

          <!-- Sección dinámica de videos recomendados -->
          ${videoSectionHTML}

          <button onclick="initQuiz(); initCounter(currentModuleId);" class="w-full py-3 mt-2 rounded-xl bg-auge-dark hover:bg-stone-800 text-white font-bold text-sm tracking-wide transition-colors shadow-sm">
            ¡Reintentar!
          </button>
        </div>
      `;
    }

    function loadCurrentModule() {
      const urlParams = new URLSearchParams(window.location.search);
      const requestedId = urlParams.get('m');

      if (!requestedId) {
        renderModulesHub();
        return;
      }

      currentModuleId = requestedId;
      const moduleConfig = MODULES_MAP[currentModuleId];

      if (!moduleConfig) {
        app.innerHTML = `
          <div class="p-6 bg-white border border-red-200 rounded-2xl text-center">
            <h2 class="text-lg font-bold text-red-600">Módulo no encontrado</h2>
            <p class="text-sm text-stone-500 mt-2">El módulo solicitado (${currentModuleId}) no existe.</p>
            <a href="index.html" class="inline-block mt-4 text-xs font-bold text-auge-orange bg-orange-50 border border-orange-200 px-4 py-2 rounded-xl hover:bg-orange-100 transition-colors">
              Volver al catálogo
            </a>
          </div>
        `;
        phaseBadge.textContent = "Error";
        return;
      }

      document.title = `Aureka | Módulo ${currentModuleId}: ${moduleConfig.name}`;
      phaseBadge.textContent = `Módulo ${currentModuleId}`;

      const script = document.createElement("script");
      script.src = `${moduleConfig.file}?v=${Date.now()}`;
      script.onload = () => {
        const badge = (typeof moduleInfo !== "undefined" && moduleInfo.badge) ? moduleInfo.badge : `Módulo ${currentModuleId}`;
        const title = (typeof moduleInfo !== "undefined" && moduleInfo.title) ? moduleInfo.title : moduleConfig.name;

        document.title = `Aureka | ${badge}: ${title}`;
        phaseBadge.textContent = badge;

        initQuiz();
        initCounter(currentModuleId);
        playIntroSplash(badge, title);
      };
      script.onerror = () => {
        app.innerHTML = `
          <div class="p-6 bg-white border border-amber-200 rounded-2xl text-center">
            <h2 class="text-lg font-bold text-amber-700">Contenido en preparación</h2>
            <p class="text-sm text-stone-500 mt-2">El archivo <b>${moduleConfig.file}</b> aún no ha sido cargado en el servidor.</p>
            <a href="index.html" class="inline-block mt-4 text-xs font-bold text-stone-600 bg-stone-100 border border-stone-200 px-4 py-2 rounded-xl hover:bg-stone-200 transition-colors">
              Volver al catálogo
            </a>
          </div>
        `;
        phaseBadge.textContent = `Módulo ${currentModuleId}`;
      };
      document.body.appendChild(script);
    }

    function playIntroSplash(badgeText, titleText, callback) {
      const splash = document.getElementById("splashScreen");
      const splashBadge = document.getElementById("splashBadge");
      const splashTitle = document.getElementById("splashTitle");

      if (!splash) {
        if (callback) callback();
        return;
      }

      splashBadge.textContent = badgeText;
      splashTitle.textContent = titleText;

      splash.classList.remove("hidden", "opacity-0", "pointer-events-none", "scale-105");

      setTimeout(() => {
        splash.classList.add("opacity-0", "pointer-events-none", "scale-105");
        setTimeout(() => {
          splash.classList.add("hidden");
          if (callback) callback();
        }, 650);
      }, 1600);
    }

    function initCounter(moduleId = currentModuleId) {
      const container = document.getElementById("visitContainer");
      if (!container) return;

      const path = `bitofbogan.github.io.aureka.m${moduleId}`;
      
      container.innerHTML = `
        <img 
          src="https://api.visitorbadge.io/api/visitors?path=${encodeURIComponent(path)}&label=Visitas&labelColor=%23F17D4B&countColor=%232D3134" 
          alt="Contador de visitas" 
          class="h-5 rounded shadow-2xs" 
          loading="lazy"
        />
      `;
    }

    function renderModulesHub() {
      const splash = document.getElementById("splashScreen");
      if (splash) splash.classList.add("hidden");

      document.title = "Aureka | Catálogo de Módulos";
      phaseBadge.textContent = "22 Módulos";
      phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-100 text-auge-orange border border-orange-200";

      initCounter("hub");

      let hubHTML = `
        <div class="animate-pop flex flex-col gap-6 py-2">
          <div class="text-center space-y-1.5">
            <span class="text-xs font-bold uppercase tracking-widest text-auge-orange">Prepa Auge</span>
            <h1 class="text-2xl sm:text-3xl font-black text-auge-dark tracking-tight">Elige tu módulo</h1>
            <p class="text-xs sm:text-sm text-stone-500 max-w-sm mx-auto leading-relaxed">
              Practica con reactivos interactivos para estudiar antes del examen.
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      `;

      Object.entries(MODULES_MAP).forEach(([id, mod]) => {
        hubHTML += `
          <a href="?m=${id}" class="group bg-white hover:bg-orange-50/50 border border-stone-200 hover:border-auge-orange p-3.5 rounded-2xl shadow-2xs hover:shadow-sm transition-all flex items-center gap-3 text-left">
            <div class="w-10 h-10 rounded-xl bg-stone-100 group-hover:bg-auge-orange group-hover:text-white text-auge-dark font-black text-sm flex items-center justify-center shrink-0 transition-colors">
              ${id}
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400 group-hover:text-amber-700 transition-colors block">
                Módulo ${id}
              </span>
              <span class="text-xs sm:text-sm font-bold text-auge-dark group-hover:text-auge-orange leading-snug line-clamp-2 transition-colors">
                ${mod.name}
              </span>
            </div>
            <span class="text-stone-300 group-hover:text-auge-orange text-sm font-bold px-1 transition-transform group-hover:translate-x-0.5 shrink-0">
              →
            </span>
          </a>
        `;
      });

      hubHTML += `
          </div>
        </div>
      `;

      app.innerHTML = hubHTML;
    }

    window.addEventListener("DOMContentLoaded", loadCurrentModule);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aureka | Módulo 21: Filosofía de la ciencia</title>
  <link rel="icon" type="image/png" href="augeicon.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            auge: {
              orange: '#F17D4B',
              darkOrange: '#D96534',
              gray: '#5A5D5E',
              dark: '#2D3134',
              canvas: '#FDFBF7'
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX para fórmulas matemáticas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- SortableJS para Drag & Drop amigable en móviles -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

  /* Transición elástica de barra de avance */
    .progress-bar-fill {
      transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Animación de error (sacudida horizontal sutil) */
    @keyframes shakeSoft {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: shakeSoft 0.35s ease-in-out;
    }

    /* Animación de acierto (salto de confirmación) */
    @keyframes bounceShort {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025) translateY(-2px); }
    }
    .animate-success {
      animation: bounceShort 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Efecto fuego estilo Balatro */
    @keyframes flameShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes flamePulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6)); }
      50% { filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.9)); }
    }

    /* Racha baja (2 a 3) */
    .fire-streak-1 {
      background: linear-gradient(90deg, #f97316, #eab308, #f97316) !important;
      background-size: 200% 200% !important;
      animation: flameShift 1.8s ease infinite;
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.5);
    }

    /* Racha media (4 a 5) */
    .fire-streak-2 {
      background: linear-gradient(90deg, #ef4444, #f97316, #fbbf24, #ef4444) !important;
      background-size: 250% 250% !important;
      animation: flameShift 1.2s ease infinite, flamePulse 1s ease-in-out infinite;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.7);
    }

    /* Racha infernal (6+) */
    .fire-streak-3 {
      background: linear-gradient(90deg, #dc2626, #ea580c, #facc15, #f43f5e) !important;
      background-size: 300% 300% !important;
      animation: flameShift 0.8s linear infinite, flamePulse 0.6s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.95), 0 0 30px rgba(250, 204, 21, 0.5);
    }
  </style>
</head>

<body class="bg-auge-canvas text-auge-dark min-h-screen flex flex-col font-sans selection:bg-orange-100">

  <!-- Header Fijo -->
  <header class="sticky top-0 z-30 w-full bg-auge-canvas/90 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="augeicon.png" alt="Logo Auge" class="w-8 h-8 object-contain rounded-lg shadow-sm" />
        <span class="font-black text-xl tracking-tight text-auge-dark">aureka</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="phaseBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 text-auge-gray border border-stone-200">
          Módulo 21
        </span>
        <button 
          type="button" 
          onclick="confirmResetQuiz()" 
          title="Reiniciar sesión" 
          class="text-xs font-medium text-stone-500 hover:text-auge-orange bg-stone-100 hover:bg-orange-50 border border-stone-200 hover:border-orange-200 px-2.5 py-1 rounded-full transition-colors flex items-center gap-1">
          <span>🔄</span> Reiniciar
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor dinámico -->
  <main id="app" class="flex-1 w-full max-w-xl mx-auto px-4 py-6 flex flex-col justify-center"></main>

  <!-- Footer con Contador de visitas -->
  <footer class="w-full max-w-xl mx-auto px-4 py-4 text-center border-t border-stone-200 text-xs text-stone-500 flex items-center justify-between">
    <span>Autogestión y Educación Comunitaria</span>
    <span class="flex items-center gap-1.5 font-medium bg-stone-100 px-2.5 py-1 rounded-full border border-stone-200">
      👁️ Visitas: <span id="visitCounter" class="text-auge-dark font-bold">...</span>
    </span>
  </footer>

  <!-- Carga del banco de preguntas -->
  <script src="questions.js"></script>

  <!-- Motor principal de la aplicación -->
  <script>
    const successPhrases = [
      "¡Excelente!",
      "¡Muy bien!",
      "¡Impecable!",
      "¡Exacto!",
      "¡Perfecto!",
      "¡Crack!"
    ];
    let currentQueue = [];
    let pendingQueue = [];
    let currentIndex = 0;
    let isReinforcementPhase = false;

    // Métricas para calificación y gamificación
    let totalQuestions = 0;
    let firstRoundCorrect = 0;
    let secondRoundResolved = 0;
    let streakCount = 0;
    let maxStreak = 0;

    const app = document.getElementById("app");
    const phaseBadge = document.getElementById("phaseBadge");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Generador de sombra con tono sutil aleatorio
    function getRandomTonedStyle() {
      // Tonos cálidos/amigables (naranjas, ámbar, verdes, azules, violetas suaves)
      const hue = Math.floor(Math.random() * 360);
      return {
        style: `box-shadow: 0 4px 14px -2px hsla(${hue}, 45%, 55%, 0.16); border-color: hsla(${hue}, 30%, 82%, 1);`,
        activeStyle: `hsla(${hue}, 40%, 96%, 1)`
      };
    }

    function initQuiz() {
      totalQuestions = questionBank.length;
      firstRoundCorrect = 0;
      secondRoundResolved = 0;
      streakCount = 0;
      maxStreak = 0;
      pendingQueue = [];
      currentIndex = 0;
      isReinforcementPhase = false;

      currentQueue = shuffle(questionBank);
      phaseBadge.textContent = "Módulo 21";
      phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 text-auge-gray border border-stone-200";
      
      renderQuestion();
    }

    function confirmResetQuiz() {
      if (confirm("¿Quieres reiniciar Aureka desde cero?")) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        initQuiz();
        initCounter(); // Incrementa visita al reiniciar voluntariamente
      }
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function toggleHint() {
      const box = document.getElementById("hintBox");
      const btn = document.getElementById("hintBtn");
      if (box && btn) {
        box.classList.toggle("hidden");
        btn.classList.add("opacity-50", "pointer-events-none");
        renderMath();
      }
    }

    function getStreakFireClass(streak) {
      if (streak >= 6) return "fire-streak-3";
      if (streak >= 4) return "fire-streak-2";
      if (streak >= 2) return "fire-streak-1";
      return "";
    }

    function renderQuestion() {
      if (currentIndex >= currentQueue.length) {
        handlePhaseCompletion();
        return;
      }

      const q = currentQueue[currentIndex];
      const progressPercent = Math.round(((currentIndex) / currentQueue.length) * 100);
      const fireClass = getStreakFireClass(streakCount);

      let contentHTML = `
        <div class="animate-pop bg-white border border-stone-200 rounded-2xl p-6 shadow-sm flex flex-col gap-5">
          <!-- Barra progreso y racha -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between text-xs font-bold">
              <span class="text-auge-orange uppercase tracking-wider">Pregunta ${currentIndex + 1} de ${currentQueue.length}</span>
              ${streakCount > 1 ? `
                <span class="flex items-center gap-1 text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200 animate-pop">
                  🔥 <span class="font-black">${streakCount}</span> en racha
                </span>
              ` : ''}
            </div>
            <div class="w-full bg-stone-100 h-2.5 rounded-full overflow-hidden transition-all">
              <div class="bg-auge-orange h-full progress-bar-fill ${fireClass}" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <!-- Prompt -->
          <div>
            <h2 class="text-xl font-bold text-auge-dark mt-0.5 leading-snug">${q.prompt}</h2>
          </div>

          ${q.image ? `
          <div class="w-full bg-stone-50 border border-stone-200 rounded-xl overflow-hidden flex justify-center p-2">
            <img src="${q.image}" alt="Material gráfico de apoyo" class="w-full max-h-64 object-contain rounded-lg" loading="lazy" />
          </div>
        ` : ''}

          <!-- Botón y Caja de Pista -->
          ${q.hint ? `
            <div class="flex flex-col items-start gap-2">
              <button type="button" onclick="toggleHint()" id="hintBtn" class="text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors">
                <span>💡</span> ¿Necesitas una pista?
              </button>
              <div id="hintBox" class="hidden w-full p-3 bg-amber-50/80 border border-amber-200/90 rounded-xl text-xs text-amber-900 leading-relaxed animate-pop">
                <span class="font-bold">Pista:</span> ${q.hint}
              </div>
            </div>
          ` : ''}

          <!-- Opciones según tipo -->
          <div id="optionsContainer" class="flex flex-col gap-3 pt-1"></div>

          <!-- Feedback & Botón siguiente -->
          <div id="feedbackContainer" class="hidden flex-col gap-3 border-t border-stone-100 pt-4 mt-2">
            <div id="feedbackBox" class="p-3.5 rounded-xl text-sm leading-relaxed"></div>
            <button id="nextBtn" class="w-full py-3 rounded-xl bg-auge-orange hover:bg-auge-darkOrange font-bold text-white transition-colors shadow-sm">
              Continuar
            </button>
          </div>
        </div>
      `;

      app.innerHTML = contentHTML;
      const optionsContainer = document.getElementById("optionsContainer");

      if (q.type === "choice") {
        const options = shuffle([q.correct, ...q.distractors]);
        options.forEach(opt => {
          const tone = getRandomTonedStyle();
          const btn = document.createElement("button");
          btn.className = "choice-btn w-full p-3.5 text-left bg-white border-2 rounded-xl font-medium transition-all text-sm sm:text-base active:scale-[0.99]";
          btn.style.cssText = tone.style;
          btn.innerHTML = opt;
          btn.onclick = () => handleChoiceAnswer(btn, opt, q);
          optionsContainer.appendChild(btn);
        });
      } else if (q.type === "drag_order") {
        const scrambled = shuffle(q.correctOrder);
        const list = document.createElement("div");
        list.id = "sortableList";
        list.className = "flex flex-col gap-2.5 cursor-grab";

        scrambled.forEach(item => {
          const tone = getRandomTonedStyle();
          const el = document.createElement("div");
          el.className = "drag-item p-3.5 bg-white border rounded-xl font-medium text-sm flex items-center justify-between";
          el.style.cssText = tone.style;
          el.innerHTML = `<span>${item}</span><span class="text-stone-400">☰</span>`;
          el.dataset.value = item;
          list.appendChild(el);
        });

        optionsContainer.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 mt-2 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar orden";
        checkBtn.onclick = () => handleDragAnswer(list, q, checkBtn);
        optionsContainer.appendChild(checkBtn);

        new Sortable(list, {
          animation: 150,
          ghostClass: 'opacity-40'
        });
      } else if (q.type === "multi_select") {
        const allOptions = shuffle([...q.correctAnswers, ...q.distractors]);
        const list = document.createElement("div");
        list.className = "flex flex-col gap-2.5";

        allOptions.forEach(opt => {
          const tone = getRandomTonedStyle();
          const item = document.createElement("div");
          item.className = "multi-select-item p-3.5 bg-white border-2 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between cursor-pointer transition-all active:scale-[0.99]";
          item.style.cssText = tone.style;
          item.dataset.value = opt;
          item.dataset.selected = "false";
          item.innerHTML = `<span>${opt}</span><span class="checkbox-indicator w-5 h-5 rounded-md border-2 border-stone-300 flex items-center justify-center text-xs text-white font-bold transition-all"></span>`;

          item.onclick = () => {
            const isSel = item.dataset.selected === "true";
            item.dataset.selected = isSel ? "false" : "true";
            const indicator = item.querySelector(".checkbox-indicator");
            if (!isSel) {
              item.classList.add("!border-auge-orange", "!bg-orange-50/50");
              indicator.classList.add("bg-auge-orange", "border-auge-orange");
              indicator.textContent = "✓";
            } else {
              item.classList.remove("!border-auge-orange", "!bg-orange-50/50");
              indicator.classList.remove("bg-auge-orange", "border-auge-orange");
              indicator.textContent = "";
            }
          };

          list.appendChild(item);
        });

        optionsContainer.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 mt-2 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Confirmar respuestas";
        checkBtn.onclick = () => handleMultiSelectAnswer(list, q, checkBtn);
        optionsContainer.appendChild(checkBtn);
      } else if (q.type === "classification") {
        const list = document.createElement("div");
        list.className = "flex flex-col gap-3";

        // Barajar los enunciados para evitar memorización de posición
        const shuffledItems = shuffle(q.items);

        shuffledItems.forEach((item, idx) => {
          const tone = getRandomTonedStyle();
          const row = document.createElement("div");
          row.className = "classification-item p-3.5 bg-white border-2 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3";
          row.style.cssText = tone.style;
          row.dataset.correct = item.correct;
          row.dataset.selected = "";

          row.innerHTML = `
            <span class="text-sm font-medium leading-snug flex-1">${item.text}</span>
            <div class="flex items-center gap-1.5 shrink-0">
              ${q.categories.map(cat => `
                <button type="button" class="tag-btn text-xs font-semibold px-3 py-1.5 rounded-lg border border-stone-300 bg-stone-50 hover:bg-stone-100 text-stone-600 transition-all">
                  ${cat}
                </button>
              `).join('')}
            </div>
          `;

          const tagButtons = row.querySelectorAll(".tag-btn");
          tagButtons.forEach(btn => {
            btn.onclick = () => {
              tagButtons.forEach(b => {
                b.className = "tag-btn text-xs font-semibold px-3 py-1.5 rounded-lg border border-stone-300 bg-stone-50 text-stone-600 hover:bg-stone-100 transition-all";
              });
              btn.className = "tag-btn text-xs font-semibold px-3 py-1.5 rounded-lg border-2 border-auge-orange bg-auge-orange text-white shadow-sm transition-all";
              row.dataset.selected = btn.textContent.trim();
            };
          });

          list.appendChild(row);
        });

        optionsContainer.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 mt-2 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar clasificación";
        checkBtn.onclick = () => handleClassificationAnswer(list, q, checkBtn);
        optionsContainer.appendChild(checkBtn);
      } else if (q.type === "fill_blanks") {
        const blanksContainer = document.createElement("div");
        blanksContainer.className = "flex flex-col gap-5";

        // Preparar banco de fichas barajadas con ID único
        const allTokens = shuffle([...q.correctOrder, ...(q.distractors || [])]).map((text, i) => ({
          id: `token_${i}_${Math.random().toString(36).substr(2, 4)}`,
          text: text
        }));

        // Estado local de los huecos: array con null o el token colocado
        const slotsState = new Array(q.correctOrder.length).fill(null);
        let activeSlotIndex = 0; // Hueco enfocado para sustitución directa

        // 1. Área del texto con los huecos limpios (sin "[ ___ ]")
        const sentenceBox = document.createElement("div");
        sentenceBox.className = "p-4 sm:p-5 bg-stone-50/70 border border-stone-200 rounded-xl leading-loose text-base font-medium text-auge-dark select-none";

        // Reemplazar {0}, {1}, etc. por ranuras estilizadas
        let formattedSentence = q.sentence;
        q.correctOrder.forEach((_, idx) => {
          formattedSentence = formattedSentence.replace(
            `{${idx}}`,
            `<span class="blank-slot inline-flex items-center justify-center min-w-[90px] h-[34px] px-3 mx-1 border-2 border-dashed border-stone-300 bg-white/80 rounded-lg text-sm font-semibold align-middle cursor-pointer transition-all hover:border-auge-orange" data-slot="${idx}"></span>`
          );
        });
        sentenceBox.innerHTML = formattedSentence;
        blanksContainer.appendChild(sentenceBox);

        // 2. Banco de fichas disponibles
        const poolTitle = document.createElement("div");
        poolTitle.className = "text-xs font-bold uppercase tracking-wider text-stone-400 -mb-2";
        poolTitle.textContent = "Opciones:";
        blanksContainer.appendChild(poolTitle);

        const poolContainer = document.createElement("div");
        poolContainer.id = "tokensPool";
        poolContainer.className = "flex flex-wrap gap-2 p-3 bg-white border border-stone-200 rounded-xl min-h-[56px] items-center";
        blanksContainer.appendChild(poolContainer);

        // 3. Botón de comprobación
        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar respuesta";
        checkBtn.onclick = () => handleFillBlanksAnswer(slotsState, q, checkBtn, blanksContainer);
        blanksContainer.appendChild(checkBtn);

        optionsContainer.appendChild(blanksContainer);

        // Funciones de renderizado e interacción
        function renderPool() {
          poolContainer.innerHTML = "";
          allTokens.forEach(token => {
            const isUsed = slotsState.some(s => s && s.id === token.id);
            if (!isUsed) {
              const chip = document.createElement("button");
              chip.type = "button";
              chip.className = "token-chip px-3.5 py-1.5 bg-white hover:bg-orange-50 border-2 border-stone-200 hover:border-auge-orange rounded-lg text-sm font-semibold text-auge-dark shadow-sm active:scale-95 transition-all";
              chip.innerHTML = token.text;
              chip.onclick = () => placeOrReplaceToken(token);
              poolContainer.appendChild(chip);
            }
          });
          renderMath();
        }

        function updateSlotsDisplay() {
          const slotElements = sentenceBox.querySelectorAll(".blank-slot");
          slotElements.forEach(el => {
            const slotIdx = parseInt(el.dataset.slot, 10);
            const currentToken = slotsState[slotIdx];
            const isActive = slotIdx === activeSlotIndex;

            if (currentToken) {
              // Hueco con ficha colocada
              el.className = `blank-slot inline-flex items-center justify-center min-w-[90px] h-[34px] px-3 mx-1 border-2 border-auge-orange bg-orange-50 text-auge-orange font-bold rounded-lg text-sm cursor-pointer shadow-sm animate-pop align-middle ${isActive ? 'ring-2 ring-auge-orange/30' : ''}`;
              el.innerHTML = `<span>${currentToken.text}</span>`;
              el.onclick = () => {
                // Tocar la ficha colocada la quita y enfoca este espacio
                slotsState[slotIdx] = null;
                activeSlotIndex = slotIdx;
                updateSlotsDisplay();
                renderPool();
              };
            } else {
              // Hueco vacío: borde punteado limpio con indicador sutil de foco
              el.className = `blank-slot inline-flex items-center justify-center min-w-[90px] h-[34px] px-3 mx-1 border-2 border-dashed rounded-lg text-sm align-middle cursor-pointer transition-all ${
                isActive 
                  ? 'border-auge-orange bg-orange-50/40 ring-2 ring-orange-200 shadow-sm' 
                  : 'border-stone-300 bg-white/90 hover:border-stone-400'
              }`;
              // Línea tenue minimalista en lugar de texto feo
              el.innerHTML = `<span class="w-6 h-0.5 rounded-full ${isActive ? 'bg-auge-orange/60' : 'bg-stone-200'}"></span>`;
              el.onclick = () => {
                activeSlotIndex = slotIdx;
                updateSlotsDisplay();
              };
            }
          });
          renderMath();
        }

        function placeOrReplaceToken(token) {
          // 1. Si el hueco activo está libre, colocarlo ahí
          if (slotsState[activeSlotIndex] === null) {
            slotsState[activeSlotIndex] = token;
          } else {
            // 2. Si ya tenía ficha, busca si hay otro hueco libre primero
            const freeIdx = slotsState.findIndex(s => s === null);
            if (freeIdx !== -1) {
              slotsState[freeIdx] = token;
              activeSlotIndex = freeIdx;
            } else {
              // 3. Sustitución directa: reemplaza la ficha del hueco activo
              slotsState[activeSlotIndex] = token;
            }
          }

          // Avanza el foco al siguiente hueco vacío disponible
          const nextFree = slotsState.findIndex(s => s === null);
          if (nextFree !== -1) {
            activeSlotIndex = nextFree;
          }

          updateSlotsDisplay();
          renderPool();
        }

        // Render inicial
        renderPool();
        updateSlotsDisplay();
      } else if (q.type === "match_columns") {
        // Pares definidos en q.pairs: [{ left: "...", right: "..." }, ...]
        const matchContainer = document.createElement("div");
        matchContainer.className = "flex flex-col gap-4";

        const leftItems = q.pairs.map((p, i) => ({ id: `L_${i}`, text: p.left, pairIndex: i }));
        const rightItems = shuffle(q.pairs.map((p, i) => ({ id: `R_${i}`, text: p.right, pairIndex: i })));

        // Almacena las conexiones: { L_0: "R_2", ... }
        const connections = {};
        let selectedLeftId = null;

        // Paleta de tonos suaves para identificar parejas formadas
        const pairColors = [
          { bg: "bg-amber-50", border: "border-amber-400", text: "text-amber-900", badge: "bg-amber-500" },
          { bg: "bg-blue-50", border: "border-blue-400", text: "text-blue-900", badge: "bg-blue-500" },
          { bg: "bg-purple-50", border: "border-purple-400", text: "text-purple-900", badge: "bg-purple-500" },
          { bg: "bg-rose-50", border: "border-rose-400", text: "text-rose-900", badge: "bg-rose-500" },
          { bg: "bg-teal-50", border: "border-teal-400", text: "text-teal-900", badge: "bg-teal-500" },
          { bg: "bg-indigo-50", border: "border-indigo-400", text: "text-indigo-900", badge: "bg-indigo-500" }
        ];

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-3";

        const colLeft = document.createElement("div");
        colLeft.className = "flex flex-col gap-2.5";

        const colRight = document.createElement("div");
        colRight.className = "flex flex-col gap-2.5";

        grid.appendChild(colLeft);
        grid.appendChild(colRight);
        matchContainer.appendChild(grid);

        const checkBtn = document.createElement("button");
        checkBtn.className = "w-full py-3 rounded-xl bg-auge-dark text-white font-bold text-sm tracking-wide shadow-sm hover:bg-stone-800 transition-colors";
        checkBtn.textContent = "Comprobar relaciones";
        checkBtn.onclick = () => handleMatchColumnsAnswer(connections, leftItems, rightItems, q, checkBtn, matchContainer);
        matchContainer.appendChild(checkBtn);

        optionsContainer.appendChild(matchContainer);

        function renderMatchView() {
          colLeft.innerHTML = "";
          colRight.innerHTML = "";

          // Render columna izquierda
          leftItems.forEach((item, idx) => {
            const isSelected = selectedLeftId === item.id;
            const connectedRightId = connections[item.id];
            const hasConnection = Boolean(connectedRightId);

            const card = document.createElement("button");
            card.type = "button";
            card.dataset.id = item.id;

            let styleClasses = "p-3 rounded-xl border-2 text-left text-sm font-medium transition-all shadow-sm flex items-center justify-between gap-2 ";

            if (isSelected) {
              styleClasses += "border-auge-orange bg-orange-50/70 ring-2 ring-orange-200 text-auge-dark";
            } else if (hasConnection) {
              const colorTheme = pairColors[idx % pairColors.length];
              styleClasses += `${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}`;
            } else {
              styleClasses += "border-stone-200 bg-white hover:border-stone-300 text-auge-dark";
            }

            card.className = styleClasses;
            card.innerHTML = `
              <span class="flex-1 leading-snug">${item.text}</span>
              ${hasConnection ? `<span class="w-5 h-5 rounded-full ${pairColors[idx % pairColors.length].badge} text-white text-[10px] font-black flex items-center justify-center shrink-0">✓</span>` : ''}
            `;

            card.onclick = () => {
              if (connections[item.id]) {
                // Si ya estaba conectado, desvincular al tocar de nuevo
                delete connections[item.id];
                selectedLeftId = null;
              } else {
                selectedLeftId = (selectedLeftId === item.id) ? null : item.id;
              }
              renderMatchView();
            };

            colLeft.appendChild(card);
          });

          // Render columna derecha
          rightItems.forEach(item => {
            // Buscar si algún elemento izquierdo está conectado a este derecho
            const connectedLeftEntry = Object.entries(connections).find(([_, rId]) => rId === item.id);
            const connectedLeftId = connectedLeftEntry ? connectedLeftEntry[0] : null;
            const leftIdx = connectedLeftId ? leftItems.findIndex(l => l.id === connectedLeftId) : -1;

            const card = document.createElement("button");
            card.type = "button";
            card.dataset.id = item.id;

            let styleClasses = "p-3 rounded-xl border-2 text-left text-sm font-medium transition-all shadow-sm flex items-center justify-between gap-2 ";

            if (connectedLeftId) {
              const colorTheme = pairColors[leftIdx % pairColors.length];
              styleClasses += `${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}`;
            } else {
              styleClasses += "border-stone-200 bg-white hover:border-stone-300 text-auge-dark";
            }

            card.className = styleClasses;
            card.innerHTML = `
              <span class="flex-1 leading-snug">${item.text}</span>
              ${connectedLeftId ? `<span class="w-5 h-5 rounded-full ${pairColors[leftIdx % pairColors.length].badge} text-white text-[10px] font-black flex items-center justify-center shrink-0">✓</span>` : ''}
            `;

            card.onclick = () => {
              if (connectedLeftId) {
                // Desconectar si ya estaba unido
                delete connections[connectedLeftId];
                renderMatchView();
                return;
              }

              if (selectedLeftId) {
                // Conectar con el izquierdo activo
                connections[selectedLeftId] = item.id;
                selectedLeftId = null;
                renderMatchView();
              }
            };

            colRight.appendChild(card);
          });

          renderMath();
        }

        renderMatchView();
      }

      

      renderMath();
    }

    function handleChoiceAnswer(selectedBtn, selectedText, question) {
      const buttons = document.querySelectorAll(".choice-btn");
      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = selectedText === question.correct;

      if (isCorrect) {
        selectedBtn.classList.add("!bg-emerald-50", "!border-emerald-500", "!text-emerald-900", "animate-success");
        selectedBtn.style.boxShadow = "0 4px 14px -2px rgba(16, 185, 129, 0.3)";
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
        streakCount++;
        if (streakCount > maxStreak) maxStreak = streakCount;
      } else {
        selectedBtn.classList.add("!bg-red-50", "!border-red-400", "!text-red-900", "animate-shake");  
        selectedBtn.style.boxShadow = "0 4px 14px -2px rgba(239, 68, 68, 0.3)";
        buttons.forEach(btn => {
          if (btn.innerHTML === question.correct) {
            btn.classList.add("!bg-emerald-50", "!border-emerald-500", "!text-emerald-900");
          }
        });
        queueForReinforcement(question);
        streakCount = 0;
      }

      showFeedback(isCorrect, question.explanation);
    }

    function handleDragAnswer(listElement, question, triggerBtn) {
      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");

      const items = Array.from(listElement.children).map(child => child.dataset.value);
      const isCorrect = items.every((val, idx) => val === question.correctOrder[idx]);

      if (isCorrect) {
        listElement.classList.add("pointer-events-none");
        Array.from(listElement.children).forEach(c => {
          c.classList.add("!bg-emerald-50", "!border-emerald-500", "!text-emerald-900");
        });
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
        streakCount++;
        if (streakCount > maxStreak) maxStreak = streakCount;
      } else {
        listElement.classList.add("pointer-events-none");
        Array.from(listElement.children).forEach(c => {
          c.classList.add("!bg-red-50", "!border-red-300", "!text-red-900");
        });
        streakCount = 0;
        queueForReinforcement(question);
      }

      showFeedback(isCorrect, question.explanation);
    }

    function handleMultiSelectAnswer(listElement, question, triggerBtn) {
      const items = Array.from(listElement.children);
      const selectedValues = items
        .filter(el => el.dataset.selected === "true")
        .map(el => el.dataset.value);

      if (selectedValues.length === 0) {
        alert("Por favor selecciona al menos una opción.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      listElement.classList.add("pointer-events-none");

      // Validar: deben coincidir exactamente todas las correctas y ninguna distractora
      const correctSet = new Set(question.correctAnswers);
      const hasAllCorrect = question.correctAnswers.every(ans => selectedValues.includes(ans));
      const hasNoExtras = selectedValues.every(ans => correctSet.has(ans));
      const isCorrect = hasAllCorrect && hasNoExtras;

      items.forEach(el => {
        const val = el.dataset.value;
        const isAnswer = correctSet.has(val);
        const wasSelected = el.dataset.selected === "true";
        const indicator = el.querySelector(".checkbox-indicator");

        // Limpia estilos en línea de color y sombra
        el.style.boxShadow = "none";

        if (isAnswer && wasSelected) {
          // 1. Acierto: era correcta y la seleccionó (Verde sólido)
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border-2 border-emerald-500 bg-emerald-50 text-emerald-950";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md bg-emerald-600 border border-emerald-600 flex items-center justify-center text-xs text-white font-black shrink-0";
          indicator.textContent = "✓";
        } else if (!isAnswer && wasSelected) {
          // 2. Error: no era correcta pero la seleccionó (Rojo marcado)
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border-2 border-red-500 bg-red-50 text-red-950 line-through decoration-red-400";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md bg-red-600 border border-red-600 flex items-center justify-center text-xs text-white font-black shrink-0";
          indicator.textContent = "✕";
        } else if (isAnswer && !wasSelected) {
          // 3. Olvido: era correcta pero no la seleccionó (Verde punteado de advertencia)
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border-2 border-dashed border-emerald-500 bg-emerald-50/50 text-emerald-900";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md border-2 border-dashed border-emerald-500 bg-white flex items-center justify-center text-xs text-emerald-600 font-bold shrink-0";
          indicator.textContent = "✓";
        } else {
          // 4. Distractor neutral no seleccionado (Atenuado)
          el.className = "multi-select-item p-3.5 rounded-xl font-medium text-sm sm:text-base flex items-center justify-between border border-stone-200 bg-stone-50 text-stone-400 opacity-60";
          indicator.className = "checkbox-indicator w-6 h-6 rounded-md border border-stone-300 bg-stone-100 flex items-center justify-center shrink-0";
          indicator.textContent = "";
        }
      });

      if (isCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
        streakCount++;
        if (streakCount > maxStreak) maxStreak = streakCount;
      } else {
        queueForReinforcement(question);
        listElement.classList.add("animate-shake");
        streakCount = 0;
      }

      showFeedback(isCorrect, question.explanation);
    }

    function handleClassificationAnswer(listElement, question, triggerBtn) {
      const rows = Array.from(listElement.children);
      const allSelected = rows.every(r => r.dataset.selected !== "");

      if (!allSelected) {
        alert("Por favor clasifica todos los enunciados antes de continuar.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      listElement.classList.add("pointer-events-none");

      let isAllCorrect = true;

      rows.forEach(r => {
        const isMatch = r.dataset.selected === r.dataset.correct;
        const buttons = r.querySelectorAll(".tag-btn");

        if (!isMatch) {
          isAllCorrect = false;
          r.classList.add("!bg-red-50/60", "!border-red-400");
        } else {
          r.classList.add("!bg-emerald-50/60", "!border-emerald-500");
        }

        buttons.forEach(btn => {
          const val = btn.textContent.trim();
          if (val === r.dataset.correct) {
            btn.classList.add("!bg-emerald-600", "!border-emerald-600", "!text-white");
          } else if (val === r.dataset.selected && !isMatch) {
            btn.classList.add("!bg-red-500", "!border-red-500", "!text-white");
          }
        });
      });

      if (isAllCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
        streakCount++;
        if (streakCount > maxStreak) maxStreak = streakCount;
      } else {
        queueForReinforcement(question);
        streakCount = 0;
      }
      if (!isAllCorrect) {
        listElement.classList.add("animate-shake");
      }

      showFeedback(isAllCorrect, question.explanation);
    }

    function handleFillBlanksAnswer(slotsState, question, triggerBtn, containerElement) {
      // Validar que todos los huecos estén llenos
      const hasEmpty = slotsState.some(s => s === null);
      if (hasEmpty) {
        alert("Por favor completa todos los espacios antes de comprobar.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      containerElement.classList.add("pointer-events-none");

      // Comprobar si cada ficha coincide con el orden correcto
      const isAllCorrect = slotsState.every((token, idx) => token.text === question.correctOrder[idx]);

      const slotElements = containerElement.querySelectorAll(".blank-slot");
      slotElements.forEach((el, idx) => {
        const isSlotCorrect = slotsState[idx].text === question.correctOrder[idx];
        if (isSlotCorrect) {
          el.className = "blank-slot inline-flex items-center justify-center min-w-[80px] px-2.5 py-1 mx-1 border-2 border-emerald-500 bg-emerald-50 text-emerald-950 font-black rounded-lg text-sm shadow-sm align-middle";
          el.innerHTML = `${slotsState[idx].text} <span class="ml-1 text-emerald-600">✓</span>`;
        } else {
          el.className = "blank-slot inline-flex items-center justify-center min-w-[80px] px-2.5 py-1 mx-1 border-2 border-red-500 bg-red-50 text-red-950 line-through decoration-red-500 font-black rounded-lg text-sm shadow-sm align-middle";
          el.innerHTML = `${slotsState[idx].text} <span class="ml-1 text-red-600">✕</span>`;
        }
      });

      if (isAllCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
        streakCount++;
        if (streakCount > maxStreak) maxStreak = streakCount;
      } else {
        queueForReinforcement(question);
        containerElement.classList.add("animate-shake");
        streakCount = 0;
      }

      showFeedback(isAllCorrect, question.explanation);
    }

    function handleMatchColumnsAnswer(connections, leftItems, rightItems, question, triggerBtn, containerElement) {
      // 1. Validar que se hayan conectado todas las parejas
      const totalPairs = leftItems.length;
      if (Object.keys(connections).length < totalPairs) {
        alert("Por favor relaciona todos los elementos antes de comprobar.");
        return;
      }

      triggerBtn.disabled = true;
      triggerBtn.classList.add("hidden");
      containerElement.classList.add("pointer-events-none");

      let isAllCorrect = true;

      // 2. Verificar cada enlace
      leftItems.forEach(lItem => {
        const connectedRightId = connections[lItem.id];
        const rItem = rightItems.find(r => r.id === connectedRightId);
        const isPairMatch = lItem.pairIndex === rItem.pairIndex;

        const leftEl = containerElement.querySelector(`[data-id="${lItem.id}"]`);
        const rightEl = containerElement.querySelector(`[data-id="${rItem.id}"]`);

        if (isPairMatch) {
          leftEl.className = "p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-950 text-sm font-semibold flex items-center justify-between";
          rightEl.className = "p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-950 text-sm font-semibold flex items-center justify-between";
          leftEl.innerHTML = `<span class="flex-1">${lItem.text}</span><span class="text-emerald-600 font-black">✓</span>`;
          rightEl.innerHTML = `<span class="flex-1">${rItem.text}</span><span class="text-emerald-600 font-black">✓</span>`;
        } else {
          isAllCorrect = false;
          leftEl.className = "p-3 rounded-xl border-2 border-red-500 bg-red-50 text-red-950 text-sm font-semibold flex items-center justify-between";
          rightEl.className = "p-3 rounded-xl border-2 border-red-500 bg-red-50 text-red-950 text-sm font-semibold flex items-center justify-between";
          leftEl.innerHTML = `<span class="flex-1">${lItem.text}</span><span class="text-red-600 font-black">✕</span>`;
          rightEl.innerHTML = `<span class="flex-1">${rItem.text}</span><span class="text-red-600 font-black">✕</span>`;
        }
      });

      // 3. Sistema de racha y refuerzo
      if (isAllCorrect) {
        if (!isReinforcementPhase) {
          firstRoundCorrect++;
        } else {
          secondRoundResolved++;
        }
        streakCount++;
        if (streakCount > maxStreak) maxStreak = streakCount;
      } else {
        queueForReinforcement(question);
        containerElement.classList.add("animate-shake");
        streakCount = 0;
      }

      showFeedback(isAllCorrect, question.explanation);
    }

    function queueForReinforcement(question) {
      if (!isReinforcementPhase && !pendingQueue.some(item => item.id === question.id)) {
        pendingQueue.push(question);
      }
    }

    function showFeedback(isCorrect, explanation) {
      const container = document.getElementById("feedbackContainer");
      const box = document.getElementById("feedbackBox");
      const nextBtn = document.getElementById("nextBtn");

      container.classList.remove("hidden");
      container.classList.add("flex");

      if (isCorrect) {
        const randomPhrase = successPhrases[Math.floor(Math.random() * successPhrases.length)];
        box.className = "p-3.5 rounded-xl text-sm leading-relaxed bg-emerald-50 text-emerald-950 border border-emerald-200";
        box.innerHTML = `<span class="font-bold text-emerald-700">${randomPhrase}</span><br>${explanation}`;
      } 
      else {
        box.className = "p-3.5 rounded-xl text-sm leading-relaxed bg-stone-100 text-auge-dark border border-stone-200";
        box.innerHTML = `<span class="font-bold text-auge-orange">Concepto a reforzar:</span><br>${explanation}`;
      }

      nextBtn.onclick = () => {
        currentIndex++;
        renderQuestion();
        // Regresa la vista suavemente arriba para la siguiente pregunta
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      renderMath();

      // Desplaza suavemente hacia el cuadro de retroalimentación y el botón
      setTimeout(() => {
        container.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    }

    function handlePhaseCompletion() {
      if (!isReinforcementPhase && pendingQueue.length > 0) {
        currentQueue = shuffle(pendingQueue);
        pendingQueue = [];
        currentIndex = 0;
        isReinforcementPhase = true;

        phaseBadge.textContent = "Segunda vuelta";
        phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-100 text-auge-orange border border-orange-200";

        app.innerHTML = `
          <div class="animate-pop bg-white border border-stone-200 rounded-2xl p-6 text-center shadow-sm flex flex-col items-center gap-4">
            <img src="augeicon.png" alt="Logo Auge" class="w-12 h-12 object-contain" />
            <div>
              <h2 class="text-xl font-bold text-auge-dark">Segunda vuelta</h2>
              <p class="text-sm text-auge-gray mt-1 max-w-sm mx-auto">
                Vamos a darle una pasada a las preguntas que tuvieron detalle para consolidarlas antes de cerrar el módulo.
              </p>
            </div>
            <button onclick="renderQuestion()" class="w-full py-3 mt-2 rounded-xl bg-auge-orange hover:bg-auge-darkOrange text-white font-bold text-sm tracking-wide transition-colors shadow-sm">
              Iniciar repaso (${currentQueue.length})
            </button>
          </div>
        `;
      } else {
        renderFinalScore();
      }
    }

    function renderFinalScore() {
      phaseBadge.textContent = "Completado";
      phaseBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200";

      // Disparo de confeti festivo con tonos Auge
      if (window.confetti) {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.65 },
          colors: ['#F17D4B', '#D96534', '#10B981', '#FBBF24']
        });
      }

      const prelimGrade = totalQuestions > 0 ? ((firstRoundCorrect / totalQuestions) * 10).toFixed(1) : "0.0";

      app.innerHTML = `
        <div class="animate-pop bg-white border border-stone-200 rounded-2xl p-6 sm:p-8 text-center shadow-sm flex flex-col items-center gap-5">
          <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-2xl font-bold">
            ✓
          </div>
          
          <div>
            <h2 class="text-2xl font-bold text-auge-dark">¡Módulo concluido!</h2>
            <p class="text-sm text-auge-gray mt-1">Has respondido el 100% de los reactivos de esta sesión.</p>
          </div>

          <div class="w-full grid grid-cols-2 gap-3 mt-1">
            <div class="bg-stone-50 border border-stone-200 rounded-xl p-3.5 flex flex-col items-center justify-center">
              <span class="text-xs text-stone-500 font-medium">Aciertos (1ª ronda)</span>
              <span class="text-2xl font-black text-auge-dark mt-0.5">${firstRoundCorrect} / ${totalQuestions}</span>
            </div>

            <div class="bg-orange-50/60 border border-orange-200/80 rounded-xl p-3.5 flex flex-col items-center justify-center">
              <span class="text-xs text-auge-orange font-bold uppercase tracking-wider">Calificación Inicial</span>
              <span class="text-2xl font-black text-auge-dark mt-0.5">${prelimGrade} <span class="text-sm font-semibold text-stone-500">/ 10</span></span>
            </div>
          </div>

          <div class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-xs text-stone-600 text-left leading-relaxed flex flex-col gap-1">
            <div>• <b>Aciertos rescatados en segunda vuelta:</b> ${secondRoundResolved} de ${totalQuestions - firstRoundCorrect} pendientes.</div>
            <div>• <b>Mejor racha consecutiva:</b> 🔥 ${maxStreak} reactivos seguidos.</div>
            <div>• <b>Aciertos totales logrados:</b> ${firstRoundCorrect + secondRoundResolved} / ${totalQuestions}.</div>
          </div>

          <button onclick="initQuiz(); initCounter();" class="w-full py-3 mt-2 rounded-xl bg-auge-dark hover:bg-stone-800 text-white font-bold text-sm tracking-wide transition-colors shadow-sm">
            ¡Reintentar!
          </button>
        </div>
      `;
    }
    async function initCounter() {
      const counterEl = document.getElementById("visitCounter");
      if (!counterEl) return;

      const namespace = "aureka_m21_prepa";
      const key = "visitas";

      // 1. Lectura inmediata de caché local para evitar cualquier retraso
      let localCount = parseInt(localStorage.getItem("aureka_visitas_count") || "0", 10);
      if (localCount > 0) {
        counterEl.textContent = localCount.toLocaleString();
      }

      try {
        // 2. Llamada directa con timeout estricto de 2s
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        // Agregamos parámetro único de tiempo para saltar la caché del navegador
        const res = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up?t=${Date.now()}`, {
          method: "GET",
          mode: "cors",
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.count !== "undefined") {
            localStorage.setItem("aureka_visitas_count", data.count);
            counterEl.textContent = Number(data.count).toLocaleString();
            return;
          }
        }
        throw new Error("Fallo en API externa");
      } catch (err) {
        // 3. Respaldo local activo: si la API externa falla o bloquea, sumamos 1 en local
        localCount = localCount > 0 ? localCount + 1 : 125;
        localStorage.setItem("aureka_visitas_count", localCount);
        counterEl.textContent = localCount.toLocaleString();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initQuiz();
      initCounter();
    });
  </script>
